name: T6 source-authenticated IPAK index and section inventory
on:
  push:
    branches: [feature/source-coverage-observatory-v1]
    paths:
      - .github/workflows/t6-observatory-ipak-index.yml
      - scripts/t6_observatory_ipak_index.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-all-ipaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate every original T6 IPAK header/index by strict HTTP R2 ranges
        run: |
          set -euo pipefail
          python3 scripts/t6_observatory_ipak_index.py \
            --headers observatory/reports/t6/all-source-headers.json \
            --out observatory/reports/t6/ipak-index.json --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t6-all-original-ipaks-section-index-proof
          path: observatory/reports/t6/ipak-index.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish proof or retain fail-visible diagnostics
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observatory/reports/t6/ipak-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proof(t6): validate physical indexes for 23 original IPAKs"
          for attempt in 1 2 3; do
            git fetch origin feature/source-coverage-observatory-v1
            git rebase origin/feature/source-coverage-observatory-v1
            if git push origin HEAD:feature/source-coverage-observatory-v1; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
