name: H1 Modern Warfare Remastered exact-source probe
on:
  push:
    branches: [main]
    paths:
      - "scripts/mwr_h1_retail_probe.py"
      - "scripts/mwr_h1_asset_directory.py"
      - "scripts/mwr_h1_image_streams.py"
      - "scripts/mwr_h1_gfxworld_probe.py"
      - "scripts/mwr_h1_world_geometry_root.py"
      - "scripts/mwr_h1_world_vertex_probe.py"
      - "scripts/mwr_h1_world_vertex_verify.py"
      - "scripts/mwr_h1_index_candidate_probe.py"
      - "scripts/mwr_h1_surface_probe.py"
      - "scripts/mwr_h1_surface_verify.py"
      - "scripts/mwr_h1_index_surface_verify.py"
      - "tests/test_mwr_h1_index_source.py"
      - "tests/test_mwr_h1_index_surface_verify.py"
      - "tests/test_mwr_h1_*.py"
      - "scripts/mwr_h1_asset_runs.py"
      - "scripts/mwr_h1_asset_payload.py"
      - "scripts/mwr_h1_index_surface_verify.py"
      - "scripts/mwr_h1_static_models_probe.py"
      - "tests/test_mwr_h1_static_models_probe.py"
      - "scripts/mwr_h1_asset_body_probe.py"
      - "tests/test_mwr_h1_asset_body_probe.py"
      - "scripts/mwr_h1_static_model_window_verify.py"
      - "scripts/mwr_h1_netconst_source.py"
      - "tests/test_mwr_h1_netconst_source.py"
      - "tests/test_mwr_h1_material_tags.py"
      - "scripts/mwr_h1_comworld_probe.py"
      - "tests/test_mwr_h1_comworld_probe.py"
      - "scripts/mwr_h1_material_window_probe.py"
      - "tests/test_mwr_h1_material_window_probe.py"
      - ".github/workflows/mwr-h1-retail-probe.yml"
  pull_request:
    paths:
      - "scripts/mwr_h1_retail_probe.py"
      - "scripts/mwr_h1_asset_directory.py"
      - "scripts/mwr_h1_image_streams.py"
      - "scripts/mwr_h1_world_geometry_root.py"
      - "scripts/mwr_h1_index_surface_verify.py"
      - "tests/test_mwr_h1_index_surface_verify.py"
      - "scripts/mwr_h1_static_models_probe.py"
      - "tests/test_mwr_h1_static_models_probe.py"
      - "scripts/mwr_h1_asset_body_probe.py"
      - "tests/test_mwr_h1_asset_body_probe.py"
      - "scripts/mwr_h1_static_model_window_verify.py"
      - "scripts/mwr_h1_netconst_source.py"
      - "tests/test_mwr_h1_netconst_source.py"
      - "tests/test_mwr_h1_material_tags.py"
      - "scripts/mwr_h1_comworld_probe.py"
      - "tests/test_mwr_h1_comworld_probe.py"
      - "scripts/mwr_h1_material_window_probe.py"
      - "tests/test_mwr_h1_material_window_probe.py"
      - ".github/workflows/mwr-h1-retail-probe.yml"
  workflow_dispatch:
    inputs:
      map_stem:
        description: "MWR map stem, e.g. mp_crash_snow"
        required: true
        type: string
        default: "mp_crash_snow"
permissions:
  contents: read
jobs:
  exact-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install independent LZ4 research tool
        run: python3 -m pip install --quiet lz4
      - name: Check H1 vertex-stride and fractional-binormal invariants
        run: python3 -m unittest discover -s tests -p test_mwr_h1_world_vertex_probe.py
      - name: Test H1 source triangle indexing
        run: python3 -m unittest discover -s tests -p test_mwr_h1_index_source.py
      - name: Verify H1 original index partitions against overlapping or missing triangles
        run: python3 -m unittest discover -s tests -p test_mwr_h1_index_surface_verify.py
      - name: Test H1 static-model source-span discovery
        run: python3 -m unittest discover -s tests -p test_mwr_h1_static_models_probe.py
      - name: Test original H1 material/image/model/ClipMap typed body scanner
        run: python3 -m unittest discover -s tests -p test_mwr_h1_asset_body_probe.py
      - name: Test original H1 NetConstStrings source cursor walk
        run: python3 -m unittest discover -s tests -p test_mwr_h1_netconst_source.py
      - name: Test original H1 virtual block material-reference bounds
        run: python3 -m unittest discover -s tests -p test_mwr_h1_material_tags.py
      - name: Test authentic H1 ComWorld light and lighting-environment reader
        run: python3 -m unittest discover -s tests -p test_mwr_h1_comworld_probe.py
      - name: Test source-native H1 material texture slot byte layout
        run: python3 -m unittest discover -s tests -p test_mwr_h1_material_window_probe.py
      - name: Fetch exact original H1 FastFiles and inspect headers and LZ4 framing
        shell: bash
        env:
          H1_STEM: ${{ inputs.map_stem || 'mp_crash_snow' }}
        run: |
          set -euo pipefail
          python3 scripts/mwr_h1_retail_probe.py \
            --stem "$H1_STEM" \
            --origin https://r2.houseofkublai.com \
            --r2-prefix h1/h1_full_files/zone \
            --output-dir "$RUNNER_TEMP/h1-original" \
            --report "$RUNNER_TEMP/h1-report.json" \
            --include-primary \
            --full-decode \
            --analyze-directory \
            --probe-gfxworld
          cat "$RUNNER_TEMP/h1-report.json"
          echo '### Verified H1 retail probe' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original source bytes remained only in ephemeral runner scratch storage.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve structured findings (no original retail binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mwr-h1-source-probe-diagnostics
          path: ${{ runner.temp }}/h1-report.json
          if-no-files-found: warn
          retention-days: 14
