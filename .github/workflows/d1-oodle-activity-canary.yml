name: D1 inspect decompressed Lua signature candidates
on:
  push:
    branches: [research/d1-oodle-activity-canary-20261127]
permissions:
  contents: read
  statuses: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: "lua-0260"
            rows: '[["0260","ps4_cosmo_activities_activity_0260",5,"08c7858b4432ca2dba6f848a81698564c8e9957edbcb950f14e188b8ebe9b529",463,31]]'
    env:
      GH_TOKEN: ${{ github.token }}
      GROUP_ID: ${{ matrix.group }}
      GROUP_ROWS: ${{ matrix.rows }}
      LINOODLE_SKIP_DLLMAIN: "1"
    steps:
      - name: Mark canary running
        run: |
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=pending -f context="d1-full-oodle/$GROUP_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Authenticating original blocks and decoding D912"
      - name: Install previously verified Oodle 3 bridge
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll -o oo2core_3_win64.dll
          curl -fsSL --retry 3 https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so -o liblinoodle3.so
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  oo2core_3_win64.dll' | sha256sum -c
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  liblinoodle3.so' | sha256sum -c
      - name: Recover archive index once per worker
        run: |
          curl -fsSL --retry 3 https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json -o activity-index.json
          curl -fsSL --retry 3 https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt -o packages.txt
      - name: Decompress exact source activity blocks and validate tables
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD"
          export OODLE_DLL="$PWD/oo2core_3_win64.dll"
          cat > scan.py <<'PY'
          import os,sys,ctypes,struct,hashlib,urllib.request,time,json,subprocess,tempfile,pathlib,collections
          from concurrent.futures import ThreadPoolExecutor
          B=0x40000
          U=lambda b,o:struct.unpack_from('<I',b,o)[0]
          Q=lambda b,o:struct.unpack_from('<Q',b,o)[0]
          H=lambda b,o:struct.unpack_from('<H',b,o)[0]
          I=lambda b,o:struct.unpack_from('<i',b,o)[0]
          L=lambda b,o:struct.unpack_from('<q',b,o)[0]
          if len(sys.argv)>1 and sys.argv[1]=='decode':
              source=pathlib.Path(sys.argv[2]).read_bytes()
              dest=pathlib.Path(sys.argv[3])
              used=int(sys.argv[4])
              dll=ctypes.CDLL(os.path.abspath('liblinoodle3.so'))
              fn=dll.OodleLZ_Decompress
              fn.restype=ctypes.c_int64
              fn.argtypes=[ctypes.c_void_p,ctypes.c_int64,ctypes.c_void_p,ctypes.c_int64,ctypes.c_int,ctypes.c_int,ctypes.c_int]+[ctypes.c_void_p]*6+[ctypes.c_int]
              src=ctypes.create_string_buffer(source)
              start=max(0x4000,(used+0x3fff)&~0x3fff)
              sizes=list(dict.fromkeys([B,start]+list(range(start,B+1,0x4000))))
              for size in sizes:
                  if size<used or size>B:continue
                  for fuzz,verb in [(1,0),(0,0),(1,1)]:
                      dst=ctypes.create_string_buffer(size)
                      n=fn(src,len(source),dst,size,fuzz,0,verb,None,None,None,None,None,None,3)
                      if n==size:
                          dest.write_bytes(dst.raw[:n]);print('DECODE',n);sys.exit(0)
              sys.exit(2)
          stem=os.environ['STEM'];patch=int(os.environ['PATCH']);family=int(os.environ['FAMILY'],16)
          import bisect,re
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          def http(url,off=None,n=None):
              for attempt in range(3):
                  try:
                      headers={'User-Agent':'d1-package-research/1.0'}
                      if off is not None:headers['Range']=f'bytes={off}-{off+n-1}'
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:
                          if off is not None:
                              assert r.status==206,(r.status,'expected range response')
                              assert r.headers['Content-Range'].startswith(f'bytes {off}-{off+n-1}/')
                          v=r.read()
                      if n is not None:assert len(v)==n
                      return v
                  except Exception:
                      if attempt==2:raise
                      time.sleep(1)
          index=json.loads(pathlib.Path('activity-index.json').read_bytes())
          assert index['status']=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE'
          source=index['source']
          sizes=list(map(int,source['part_sizes']))
          starts=[0]
          for n in sizes:starts.append(starts[-1]+n)
          assert hashlib.sha256(pathlib.Path('packages.txt').read_bytes()).hexdigest()==source['package_list_sha256']
          fam=index['package_families']
          members=fam.get(f'{family:04X}') or fam.get(f'{family:04x}')
          assert members
          byname={pathlib.Path(x['name']).name:x for x in members}
          def readat(off,n):
              chunks=[]
              while n:
                  part=bisect.bisect_right(starts,off)-1
                  assert 0<=part<len(sizes)
                  local=off-starts[part];take=min(n,sizes[part]-local)
                  chunks.append(http(f'{base}/packages.tar.{part+1:03d}',local,take))
                  off+=take;n-=take
              return b''.join(chunks)
          def get(p,off=None,n=None):
              name=stem+'_'+str(p)+'.pkg'
              row=byname[name];start=int(row['data_offset']);size=int(row['size'])
              if off is None:off=0;n=size
              assert 0<=off<=off+n<=size
              return readat(start+off,n)
          b=get(patch)
          pin=os.environ['PIN']
          assert hashlib.sha256(b).hexdigest()==pin,('R2 logical snapshot mismatch',hashlib.sha256(b).hexdigest())
          print('R2_LOGICAL_SNAPSHOT_MATCH',hashlib.sha256(b).hexdigest(),flush=True)
          assert H(b,0)==24 and H(b,4)==family and H(b,0x20)==patch
          ec,eo,bc,bo=U(b,0xb4),U(b,0xb8),U(b,0xd0),U(b,0xd4)
          assert eo+16*ec<=len(b) and bo+32*bc<=len(b)
          assert hashlib.sha1(b[eo:eo+16*ec]).digest()==b[0xbc:0xd0]
          assert hashlib.sha1(b[bo:bo+32*bc]).digest()==b[0xd8:0xec]
          used=[0]*bc;targets=[];needed=set()
          def spans(i):
              p=eo+i*16;q=Q(b,p+8);sz=(q>>28)&0x3fffffff;k=q&0x3fff;o=((q>>14)&0x3fff)*16
              while sz:
                  assert k<bc
                  n=min(sz,B-o);yield k,o,n;sz-=n;k+=1;o=0
          for i in range(ec):
              s=list(spans(i))
              for k,o,n in s:used[k]=max(used[k],o+n)
              if U(b,eo+i*16)==0x808012d9 and U(b,eo+i*16+4)&255==16 and s:
                  targets.append((i,s));needed.update(k for k,o,n in s)
          print('TARGETS',len(targets),'BLOCKS',len(needed),flush=True)
          def block(k):
              p=bo+k*32;off,n,owner,flags=struct.unpack_from('<IIHH',b,p)
              raw=get(owner,off,n) if owner!=patch else b[off:off+n]
              assert hashlib.sha1(raw).digest()==b[p+12:p+32],('SHA1',k)
              if flags==0:
                  assert len(raw)>=used[k]
                  return k,raw,None
              if flags!=1:return k,None,('flags',flags)
              with tempfile.TemporaryDirectory() as d:
                  a=pathlib.Path(d)/'stored';z=pathlib.Path(d)/'raw';a.write_bytes(raw)
                  r=subprocess.run([sys.executable,__file__,'decode',str(a),str(z),str(used[k])],capture_output=True,timeout=60)
                  if r.returncode or not z.exists():return k,None,('decode',r.returncode)
                  data=z.read_bytes()
                  assert used[k]<=len(data)<=B
                  return k,data,None
          cache={};fail={}
          with ThreadPoolExecutor(max_workers=4) as ex:
              for k,data,error in ex.map(block,sorted(needed)):
                  if error:fail[k]=error
                  else:cache[k]=data
          print('BLOCK_RESULT',len(cache),len(fail),fail,flush=True)
          assert len(targets)==int(os.environ['EXPECTED_TABLES'])
          assert len(needed)==int(os.environ['EXPECTED_BLOCKS'])
          lua_blocks=sum(v.count(b'\x1bLua') for v in cache.values())
          raw_bytes=sum(len(v) for v in cache.values())
          for k,data in sorted(cache.items()):
              pos=-1
              while True:
                  pos=data.find(b'\x1bLua',pos+1)
                  if pos<0:break
                  hdr=data[pos:pos+24]
                  owners=[]
                  for i in range(ec):
                      cur=0
                      for kk,oo,nn in spans(i):
                          if kk==k and oo<=pos<oo+nn:
                              p=eo+i*16
                              owners.append(dict(tag=f'{0x80800000+(family<<13)+i:08x}',ref=f'{U(b,p):08x}',type_word=f'{U(b,p+4):08x}',entry_size=(Q(b,p+8)>>28)&0x3fffffff,entry_offset=cur+pos-oo))
                          cur+=nn
                  ver=hdr[4] if len(hdr)>4 else None
                  fmt=hdr[5] if len(hdr)>5 else None
                  valid51=len(hdr)>=12 and ver==0x51 and fmt==0 and hdr[6] in (0,1) and hdr[7] in (4,8) and hdr[8] in (4,8) and hdr[9]==4 and hdr[10] in (4,8) and hdr[11] in (0,1)
                  valid52=len(hdr)>=18 and ver==0x52 and fmt==0 and hdr[12:18]==b'\x19\x93\r\n\x1a\n'
                  valid53=len(hdr)>=12 and ver in (0x53,0x54) and fmt==0 and hdr[6:12]==b'\x19\x93\r\n\x1a\n'
                  print('LUA_CANDIDATE',json.dumps(dict(block=k,offset=pos,header_hex=hdr.hex(),version=ver,format=fmt,standard_header_plausible=bool(valid51 or valid52 or valid53),owners=owners,block_sha256=hashlib.sha256(data).hexdigest())),flush=True)
          r10_refs=collections.Counter()
          for i,sp in targets:
              if any(k not in cache for k,o,n in sp):continue
              data=b''.join(cache[k][o:o+n] for k,o,n in sp)
              v=U(data,0x10)
              if v in (0,0xffffffff):r10_refs['null']+=1
              elif 0x80800000<=v<0x82000000:
                  famid=(v-0x80800000)>>13
                  idx=v&8191
                  if famid==family and idx<ec:r10_refs[f'local_ref_{U(b,eo+idx*16):08x}']+=1
                  else:r10_refs[f'other_family_{famid:04x}']+=1
              else:r10_refs['other']+=1
          print('R10_REFS',json.dumps(dict(r10_refs),sort_keys=True),flush=True)
          def dyn(data,o,stride):
              assert o+16<=len(data)
              count=I(data,o);start=o+8+L(data,o+8)+16
              assert count>=0 and (count==0 or 0<=start<=start+count*stride<=len(data))
              return count,start
          def ptr(data,o):
              assert o+8<=len(data)
              rel=L(data,o)
              if not rel:return None,None
              t=o+rel;assert 4<=t<=len(data)
              return t,U(data,t-4)
          done=valid=records=locations=lua=group_total=worldid_null=names_count=0;errors=[];families=set();group_types=set();script_families=set();other_classes=collections.Counter();ref10=collections.Counter()
          digest=hashlib.sha256()
          for i,s in targets:
              if any(k not in cache for k,o,n in s):continue
              data=b''.join(cache[k][o:o+n] for k,o,n in s);done+=1
              digest.update(struct.pack('<I',i));digest.update(hashlib.sha256(data).digest())
              lua+=data.count(b'\x1bLua')
              try:
                  assert len(data)>=0x40
                  groups,g=dyn(data,0x20,0x38);loc,_=dyn(data,0x30,0x30)
                  rec=0;ent=[];worldid=nm=0;types=set();other=collections.Counter()
                  sf=U(data,8);r10=U(data,0x10)
                  refkey='null' if r10 in (0,0xffffffff) else 'filehash_range' if 0x80800000<=r10<0x82000000 else 'other'
                  for j in range(groups):
                      types.add(U(data,g+j*0x38))
                      num,a=dyn(data,g+j*0x38+8,0x10)
                      for x in range(num):
                          t,c=ptr(data,a+x*0x10)
                          assert c==0x80800406 and t+0x90<=len(data)
                          ent.append(U(data,t));rec+=1
                          if Q(data,t+0x80)==0xffffffffffffffff:worldid+=1
                          dr,dc=ptr(data,t+0x88)
                          if dc==0x80801333:
                              assert dr+0x24<=len(data)
                              nm+=1
                          elif dc is not None:other[f'{dc:08x}']+=1
                  valid+=1;records+=rec;locations+=loc;families.update(ent);group_total+=groups;worldid_null+=worldid;names_count+=nm;group_types.update(types);script_families.add(sf);other_classes.update(other);ref10[refkey]+=1
              except (AssertionError,struct.error) as e:errors.append((i,str(e)))
          result=dict(family=f'{family:04x}',target_tables=len(targets),blocks=len(needed),decoded_blocks=len(cache),failed_blocks=len(fail),decoded_tables=done,structurally_valid_tables=valid,spawn_records=records,location_rows=locations,entity_families=len(families),lua_magic_hits=lua,lua_magic_hits_in_full_blocks=lua_blocks,decoded_block_bytes=raw_bytes,groups=group_total,unique_group_type_hashes=len(group_types),unique_script_family_hashes=len(script_families),worldid_null_records=worldid_null,records_with_name_data=names_count,other_dataresource_classes=dict(other_classes),unknown_ref10_classification=dict(ref10),layout_errors=len(errors),first_errors=errors[:10],entry_digest=digest.hexdigest())
          print('RESULT',json.dumps(result,sort_keys=True),flush=True)
          pathlib.Path(f'result_{family:04x}.json').write_text(json.dumps(result))
          assert done==len(targets) and valid==done and not fail,result
          PY
          python - <<'PY'
          import json,os,subprocess,sys
          rows=json.loads(os.environ['GROUP_ROWS'])
          failed=[]
          for fam,stem,patch,pin,n,k in rows:
              env=os.environ|{'FAMILY':fam,'STEM':stem,'PATCH':str(patch),'PIN':pin,'EXPECTED_TABLES':str(n),'EXPECTED_BLOCKS':str(k)}
              p=subprocess.run([sys.executable,'scan.py'],env=env)
              if p.returncode:failed.append(fam)
          print('GROUP_FAILURES',failed,flush=True)
          sys.exit(bool(failed))
          PY
      - name: Publish research status (no raw package uploads)
        if: always()
        run: |
          state=success
          if [ "${{ job.status }}" != success ]; then state=failure; fi
          desc=$(python -c 'import glob,json; a=[json.load(open(x)) for x in glob.glob("result_*.json")]; print("{} tables; {} records; {} layout errors".format(sum(x["decoded_tables"] for x in a),sum(x["spawn_records"] for x in a),sum(x["layout_errors"] for x in a)))')
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context="d1-full-oodle/$GROUP_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="$desc"
