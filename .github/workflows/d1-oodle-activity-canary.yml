name: D1 original rank-derived flag closure and item counter defaults
on:
  push:
    branches: [research/d1-oodle-activity-canary-20261127]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  join:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retrieve authenticated derived evidence from completed research runs
        run: |
          set -euo pipefail
          gh run download 45957952501 -R "$GITHUB_REPOSITORY" -n d1-investment-definition-unlock-objective-master -D master
          gh run download 45957952501 -R "$GITHUB_REPOSITORY" -n d1-investment-definition-activity-expressions -D selectors
          gh run download 45958152986 -R "$GITHUB_REPOSITORY" -n d1-item-and-prerequisite-items-0131 -D items
          gh run download 45958152986 -R "$GITHUB_REPOSITORY" -n d1-item-and-prerequisite-items-0132 -D items
          gh run download 45958179948 -R "$GITHUB_REPOSITORY" -n d1-item-and-prerequisite-activity-prerequisites -D gates
      - name: Join item identity, completion, objective and expression tables
        run: |
          python - <<'PY'
          import json,collections,pathlib,hashlib,itertools
          C=collections.Counter
          def load(p):return json.loads(pathlib.Path(p).read_text())
          f=load('master/investment-8141.json');v=load('master/investment-570.json');o=load('master/investment-8127.json');p=load('master/investment-8132.json');m=load('master/investment-8126.json')
          t=load('master/investment-579.json');c=load('master/investment-564.json')
          i=load('items/items-0131.json')+load('items/items-0132.json')
          g=load('gates/prerequisites-8112.json');a=load('gates/prerequisites-6771.json');s=load('selectors/investment-6771.json')
          im={x['tag']:x for x in i};assert len(im)==len(i)==len(m)==8609
          bad=[x for x in m if x['ref'] not in im or im[x['ref']]['hash']!=x['hash']]
          assert not bad,bad[:5]
          ordered=[dict(index=x['index'],**im[x['ref']]) for x in m]
          errs=[];scope=C();missing=[];local_scope=C();obj_uses=C();flags=C();guard_scope=C();bundle_counts=C();auto=C();value_defaults=C()
          for row in ordered:
              vals={x['index'] for x in row['local_values']}
              for x in row['local_values']:
                  ix=x['index']
                  if not 0<=ix<len(v):errs.append(('local_value',row['index'],ix));continue
                  local_scope[v[ix]['scope']]+=1
                  value_defaults[x['raw']]+=1
              for ix in row['objectives']:
                  if not 0<=ix<len(o):errs.append(('objective',row['index'],ix));continue
                  obj_uses[ix]+=1
                  oi=o[ix];vi=oi['value'];sc=v[vi]['scope'];scope[sc]+=1
                  if sc==3 and vi not in vals:missing.append(dict(item=row['index'],hash=row['hash'],objective=ix,value=vi))
              fi=row['acquisition_flag']
              if fi!=-1:
                  if not 0<=fi<len(f):errs.append(('flag',row['index'],fi))
                  else:flags[f[fi]['scope']]+=1
              if row['acquisition_bundle']!=-1:bundle_counts['acquisition']+=1
              z=row['completion']
              if z is not None:
                  auto[str(z['automatic'])+':'+str(z['all'])]+=1
                  if z['guard']!=-1:
                      if not 0<=z['guard']<len(v):errs.append(('guard',row['index'],z['guard']))
                      else:guard_scope[v[z['guard']]['scope']]+=1
                  for key in ('bundle_first','bundle_second'):
                      if z[key]!=-1:bundle_counts[key]+=1
          assert not errs,errs[:10]
          print('ITEM_GRAPH_CLOSURE',json.dumps(dict(items=len(ordered),hash_ref_mismatches=len(bad),distinct_objectives=len(obj_uses),objective_refs=sum(obj_uses.values()),max_objective_reuse=max(obj_uses.values()),objective_scope_counts=dict(scope),scope3_missing_local=len(missing),missing_local_sample=missing[:15],local_value_scopes=dict(local_scope),completion_modes=dict(auto),acquisition_flag_scopes=dict(flags),guard_scopes=dict(guard_scope),bundle_references=dict(bundle_counts),local_value_payloads=value_defaults.most_common(12),max_objectives=max(len(x['objectives']) for x in ordered),max_values=max(len(x['local_values']) for x in ordered))),flush=True)
          def valid_expr(e):
              depth=0;peak=0;bad=[]
              for op,arg in e:
                  if op in (1,10,11):
                      depth+=1
                      if op==1 and not 0<=arg<len(f):bad.append(('flag',arg))
                      if op==10 and not 0<=arg<len(v):bad.append(('value',arg))
                  elif op in (2,21):
                      if depth<1:bad.append(('underflow',op))
                  elif op in (3,4,5,6,7,8,9,12,13,14,15,16,17,18,19,20):
                      if depth<2:bad.append(('underflow',op))
                      depth-=1
                  else:bad.append(('opcode',op))
                  peak=max(depth,peak)
              if e and depth!=1:bad.append(('enddepth',depth))
              if peak>64:bad.append(('overflow',peak))
              return bad,peak
          sets={'activity_direct':[e for x in a for k in ('first','second') for e in x[k]],'group':[e for x in g for k in ('first','second') for e in x[k]],'reward_selectors':[z['expression'] for x in s for z in x['selectors']],'progression_policies':[z['expression'] for x in p for z in x['policies']]}
          summary={}
          for name,es in sets.items():
              checks=[valid_expr(e) for e in es];bad=[(j,b) for j,(b,_) in enumerate(checks) if b]
              assert not bad,(name,bad[:10])
              summary[name]=dict(expressions=len(es),nonempty=sum(bool(e) for e in es),op_count=sum(map(len,es)),max_stack=max((n for _,n in checks),default=0),flag_scope_refs=dict(C(f[arg]['scope'] for e in es for op,arg in e if op==1)),value_scope_refs=dict(C(v[arg]['scope'] for e in es for op,arg in e if op==10)),unique_flags=len(set(arg for e in es for op,arg in e if op==1)),unique_values=len(set(arg for e in es for op,arg in e if op==10)))
          print('EXPRESSION_CLOSURE',json.dumps(summary),flush=True)
          refs=[(x['index'],j,z['reward']) for x in p for j,z in enumerate(x['steps']) if z['reward']!=-1]
          assert all(0<=r<len(f) for _,_,r in refs)
          print('RANK_FLAG_CLOSURE',json.dumps(dict(refs=len(refs),unique_flags=len(set(r for _,_,r in refs)),scopes=dict(C(f[r]['scope'] for _,_,r in refs)),progressions=len(set(k for k,_,_ in refs)),level_flags=[dict(step=j,flag=r,hash=f[r]['hash'],scope=f[r]['scope']) for k,j,r in refs if k==117],examples=[dict(progression=k,step=j,flag=r,hash=f[r]['hash'],scope=f[r]['scope'],slot=f[r]['slot']) for k,j,r in refs[:12]],policy_flags=[f[k] for k in (435,2211,2233,2585,2668,2867,4745,5005,5021,836,2838)])),flush=True)
          # Re-label legacy output key "reward": native 28CEC0 writes these directly to merged flags, not item grants.
          for x in p:
              for z in x['steps']:
                  z['derived_flag']=z.pop('reward')
          print('LOCAL_DEFAULTS',json.dumps(dict(default_counts=dict(C(str(int.from_bytes(bytes.fromhex(z['raw'])[2:6],'little',signed=True)) for x in ordered for z in x['local_values'])),defaults_nonzero=[dict(item=x['index'],hash=x['hash'],values=[z for z in x['local_values'] if int.from_bytes(bytes.fromhex(z['raw'])[2:6],'little',signed=True)]) for x in ordered if any(int.from_bytes(bytes.fromhex(z['raw'])[2:6],'little',signed=True) for z in x['local_values'])][:8])),flush=True)
          pathlib.Path('corrected-progression-flags.json').write_text(json.dumps(p,indent=2))
          # Explicit exact gate truth table for level policies only (all expressions are boolean).
          level=p[117]['policies'];keys=sorted(set(arg for z in level for op,arg in z['expression'] if op==1))
          def ev(e,state):
              st=[]
              for op,arg in e:
                  if op==1:st.append(state[arg])
                  elif op==2:st[-1]=not st[-1]
                  elif op in (3,4):
                      r=st.pop();l=st.pop();st.append((l or r) if op==3 else (l and r))
                  else:raise AssertionError(op)
              return bool(st[0]) if st else False
          import struct
          f32=lambda x:struct.unpack('<f',struct.pack('<f',x))[0]
          results=C()
          for bits in itertools.product((False,True),repeat=len(keys)):
              state=dict(zip(keys,bits))
              for rank in (1,2,6,7,33,34,39,40):
                  cap=0;mul=1.0
                  for z in level:
                      tests=[]
                      if z['expression']:tests.append(ev(z['expression'],state))
                      if z['min_rank']>0:tests.append(z['min_rank']<=rank)
                      if z['max_rank']>0:tests.append(rank<=z['max_rank'])
                      if not tests or (all(tests) if z['mode']==1 else any(tests)):
                          mul=f32(mul*z['multiplier'])
                          if z['rank_cap']:cap=min(cap,z['rank_cap']) if cap else z['rank_cap']
                  results[(rank,cap,round(mul,6))]+=1
          print('LEVEL_POLICY_TRUTH_AUDIT',json.dumps(dict(flag_indices=keys,flag_hashes={k:f[k]['hash'] for k in keys},cases=2**len(keys)*8,rank_caps=dict(C({str(k):sum(n for (r,c,m),n in results.items() if c==k) for k in set(c for r,c,m in results)})),distinct_outcomes=len(results),level2_no_flag=[dict(rank=2,cap=c,multiplier=m) for (r,c,m),n in results.items() if r==2 and c==7 and m==0],policies=level)),flush=True)
          pathlib.Path('joined-item-objectives.json').write_text(json.dumps(ordered,indent=2))
          pathlib.Path('expression-closure.json').write_text(json.dumps(summary,indent=2))
          PY
      - name: Publish normalized joined index
        uses: actions/upload-artifact@v4
        with:
          name: d1-joined-investment-graph
          path: |
            joined-item-objectives.json
            expression-closure.json
            corrected-progression-flags.json
      - name: Publish result
        if: always()
        run: |
          state=success
          if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context="d1-investment-graph-closure" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Full original investment graph validation"
