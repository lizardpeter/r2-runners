      - name: Publish incident research status (no raw data uploads)
        if: always()
        run: |
          state=success
          if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context="d1-incident-catalogue/$GROUP_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Incident catalogue extraction audit"
      - name: Upload normalized definition records
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d1-investment-definition-${{ matrix.group }}
          path: |
            investment-*.json
            incident-map.json
