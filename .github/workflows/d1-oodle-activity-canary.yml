name: D1 exact checkpoint and completion incident catalogue join
on:
  push:
    branches: [research/d1-oodle-activity-canary-20261127]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  join:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retrieve derived original incident catalogue
        run: |
          gh run download 45955815538 -R "$GITHUB_REPOSITORY" -n d1-incident-index-incident-join -D incident
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('incident/incident-index-0131.json')
          a=json.loads(p.read_text())['rows']
          wanted=['f41ef26b','aff7735c','5f39a8ca','d89fc868','790c2a95','bd1ba345','74af5222','e74eed45']
          found=[x for x in a if x['hash'] in wanted]
          assert len(found)==len(wanted),(found,wanted)
          print('CHECKPOINT_INCIDENT_INDEX',json.dumps(found),flush=True)
          PY
      - name: Publish result
        if: always()
        run: |
          state=success
          if [ "${{ job.status }}" != success ]; then state=failure; fi
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context="d1-checkpoint-incident-join" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Original checkpoint incident catalogue"
