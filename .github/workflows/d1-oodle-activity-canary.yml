name: D1 original reward bundle and progression curve join
on:
  push:
    branches: [research/d1-oodle-activity-canary-20261127]
permissions:
  contents: read
  statuses: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: "investment-join"
            rows: '[["012f","ps4_investment_globals_012f",6,"64c3ca342bdb741e4672aa4593e2925466f8122e5ed7aba20b862af88d61bbb9",1,1,564],["012f","ps4_investment_globals_012f",6,"64c3ca342bdb741e4672aa4593e2925466f8122e5ed7aba20b862af88d61bbb9",1,2,8132],["012f","ps4_investment_globals_012f",6,"64c3ca342bdb741e4672aa4593e2925466f8122e5ed7aba20b862af88d61bbb9",1,1,8134],["012f","ps4_investment_globals_012f",6,"64c3ca342bdb741e4672aa4593e2925466f8122e5ed7aba20b862af88d61bbb9",1,1,579],["0131","ps4_investment_globals_0131",6,"47bdd13ca9b0186318077ef6ea0b1b0fa38dce2f406658253857af6503de9ecc",1,3,6774]]'
          - group: "activity-selectors"
            rows: '[["0131","ps4_investment_globals_0131",6,"47bdd13ca9b0186318077ef6ea0b1b0fa38dce2f406658253857af6503de9ecc",1,2,6771]]'
    env:
      GH_TOKEN: ${{ github.token }}
      GROUP_ID: ${{ matrix.group }}
      GROUP_ROWS: ${{ matrix.rows }}
      LINOODLE_SKIP_DLLMAIN: "1"
      ALL_PINS: '{"03f5":"9167edb065154d2afc39ed15190dae8ac0213a6b525db2e6436d532c023bd396","07d4":"0361e089b8301d4951124b40e80b467fa7ead21031728ac7f66f1ea07819fc09","0244":"1537bc62b74f19065c7e1416e3a7eb2b49429f6458024f716ecb255e871f93bf","04ca":"110843c874fd79c38752d9ac6c4482aa0b6ec5d40057e877c9be8f306d57abce","065b":"38da94e9d8e0584e7eb60f8642851bb486827219224cab9368f6721b4ef2173e","0260":"08c7858b4432ca2dba6f848a81698564c8e9957edbcb950f14e188b8ebe9b529","053f":"d397779f363786364e3e3a61e250e0c24ac03c0b0b109ec0b74bf46985d8a97e","07d5":"f7671ae60c471d05c34f8ea94ca0d1b8ef8731b36276fcd35509ae5136683715","0268":"4479b7565e52e4d6ff723c500dac0f8d2afc4531972d5c88e273a410c3804ec6","0809":"3b132b3dd4aa1d99394ab0477833bbd0b5da99b1f43887f3eb92a2760a4197dd","067a":"b9a687a08da461ea8a10d637ad3d048adfaf2d02bee03d6c4cab54e5244e2daa","0285":"6acd380360780efef94d64bf69d459466e6d0e5625b06dd651ff2e03ca949729","0265":"f7c9dfa3cd3c6ffb49ae94fd8af6240783c020731d1464185dbc0ffe235fbf74","0447":"012525f124c7a2c671f0f6f32ef4207bf07ae4a6496b4ae5897fe9b787395bf1","03fd":"6a484699c51894ae8fd186e5a604295806fff696200874fe3cc382725bbb0656","081d":"c8548555253b72a43fb140f4f18d91182fdee223fc79c270da845affde6c5ff6","06f9":"4a10289b167381e389971f0778bda852d4eaf4d8535e060987b1879f58a2b950","03f3":"9ef75ca71d152210a290f888b78e8561af8da2ede857519a0c8d79cb0cccb3eb","053e":"670400eac2033d78b4d632330cc6e8ccdbd1f1691b1c088a1adb89fb6fbcb2f2","07d2":"59e0025c206a36cd612fc6edf5134eba268aee79cec7fd6161c77bf1445af8a4","0286":"35079c75f21885714469719cd8cfb584a33e498496614a1ac46b826fea594cd2","0542":"51e2c4b52d393a1d81b534255b157d8ef5b0f98d8fafe31197de81f523f849ab","0797":"27d5f37cbd83fedbeea7a956db2e59090e835bcfe0336c7510e0839fb1bdfdf0","0261":"2ac1b8471c355d4a79ba18671934428f31916715d5947ca603dc57d9081e8590","07de":"5f8ea30a40d754c2e23fe1cfae0a0eefd6e8d04486ba9dc63aa481dfb3262a7e","028d":"c4381ae64593a66006ee34d544b7b98a0a06fe89b5c53fe600ca8c35b2df0d83","07e1":"2b052bceaff03321ea92f4cbcc240599a64e7badd615e907ebd9553e9573f00d","082f":"0da4a9b116536ffb31245fb8d03760694e125d0c6329aabe42f0fd58f7cdd4b9","0843":"3f84dcf1e4e7f8d124a28d3853fb5df080ed48a86f59a19c8f2e378fe2f5d2fe","0284":"24a30e4980038c06d72bb81d037a85c34918d75a15be59738d468a0982803cbb","025c":"c6424371d5e675263a949184f48a936328294ee51b9f15d17c78744b9ad79e05","02af":"67cc91cb88b60c739d3158553960d11ff59d8d5090863774186c5b5c1c29ee21","02ac":"0d460d2947b9190bf8c043b6e157aa79d44d9268aaa6afe3f9a9ca2b8ac969e6","044b":"0998dc5aefe35eea2f5b1c6637103acd6e20dbc13fec544e26eb8cbfff3eab43","08b2":"732a07298c6bb4200c5774f49ed5c6537ad9115be581edd7d95ee300334878a2","0538":"453763222619df768d6f304ecc1464f2ba582a75eb78d6da9439c0d21e91ce2e","053b":"82fd87417244d42c0bd8c519fa4594e9ae1fd102375125b6bc2dc1c6a49cce6d","053d":"a81268ae79622465a9f41aeb14597dec4469bd5c2e14210747c9f5eafcbbe6b9","02a6":"f344538a2d68d7787494aa725467d3c5f7443209b29ac38517e8fa27c1c52493","04ce":"dded056f354c2df1476cee935da0fd18189e80278eb085f5b785334ab5f06f12","0896":"70a2308a3ce4435a6c8d88ac494f2c8755055c5a17dcb96ebce5460829b3d1ff","03f6":"a716343340f5c24a2efbdaf4ffe8193d26645c989f552d0ced4b7304dacb68ab","03fa":"7f0c3353dea7f79bcc745086e6e7134f3a89317c111e88efadb67d07dd5c8460","0289":"cf0fb09c358af1982a6ad59e9fc71315428b609396b824d773c35de7165f0e6b","07cf":"3864d97aece9e1b2576f3fde09da82fd5b0c398fb981d172ed476ca260e227a1","04cf":"5be9e3a9439206c9fa3512c0f7fbe0df0650307686ac50e4bdb631e6b5a89cd2","02e2":"4dd69a09795d409f5867370b996e16107037de5f03887be60fd90723164468fa","0854":"b8a5202f9d7df32acaec69a71e9ff013b19e9bea1f3bd6e6555c4b82f7193ee5","02ab":"8bdd14086cdfb8e08fe59b48541625218e3efa732ccd9d3dce4c4dec404bc21c","03f0":"e25f2019f10f05dc1c550c89a4b23e98d703642cbc6a9af4e4cb2bf18aea03c3","023d":"de0a2e4052602d26184d9f739678a0805b8cb8272f3758204700e1687cb55695","02ad":"8595fa84089fc6cb8a4faf28c2ec4d2961d3d609291c2eb61d461f5148c4a0b5","06dd":"cfe9224f7f58f46b8bd9455e0016ad455c5e6fb8ec68c691312c4bebe51eb72e","0333":"28399e5706d6a9f509d9ac239ea63f0403553129530c38e744626c7f809097ca","0280":"665b688337d272fa2926681092fe7df40b2ceb404643b3f813c8675cad5e658b","02aa":"8e6530fea66858b61e0b1cc794b172ae0f2c7a80c55df22a553f14d72d09d591","0262":"1310a07cc31f2615ad999976feb66b6b132c6329b56aa63a1e1decd61dbd7b62","0553":"c4e907612b03569c7ba10014fc3ecb25b407c1d712464c739268c14888d186c2","0805":"47b34c760c4f1f7792e4046575a8323eb82a5a52a6055e06071dfc592520f088","04d4":"685f194f9a36151d9af806e395e09b322c5928bd481a9cfc6f8a01cbcd5ae8f6"}'
    steps:
      - name: Mark canary running
        run: |
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=pending -f context="d1-full-oodle/$GROUP_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Authenticating original blocks and decoding D912"
      - name: Install previously verified Oodle 3 bridge
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll -o oo2core_3_win64.dll
          curl -fsSL --retry 3 https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so -o liblinoodle3.so
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  oo2core_3_win64.dll' | sha256sum -c
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  liblinoodle3.so' | sha256sum -c
      - name: Recover archive index once per worker
        run: |
          curl -fsSL --retry 3 https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json -o activity-index.json
          curl -fsSL --retry 3 https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt -o packages.txt
      - name: Decompress exact source activity blocks and validate tables
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD"
          export OODLE_DLL="$PWD/oo2core_3_win64.dll"
          cat > scan.py <<'PY'
          import os,sys,ctypes,struct,hashlib,urllib.request,time,json,subprocess,tempfile,pathlib,collections
          from concurrent.futures import ThreadPoolExecutor
          B=0x40000
          U=lambda b,o:struct.unpack_from('<I',b,o)[0]
          Q=lambda b,o:struct.unpack_from('<Q',b,o)[0]
          H=lambda b,o:struct.unpack_from('<H',b,o)[0]
          I=lambda b,o:struct.unpack_from('<i',b,o)[0]
          L=lambda b,o:struct.unpack_from('<q',b,o)[0]
          if len(sys.argv)>1 and sys.argv[1]=='decode':
              source=pathlib.Path(sys.argv[2]).read_bytes()
              dest=pathlib.Path(sys.argv[3])
              used=int(sys.argv[4])
              dll=ctypes.CDLL(os.path.abspath('liblinoodle3.so'))
              fn=dll.OodleLZ_Decompress
              fn.restype=ctypes.c_int64
              fn.argtypes=[ctypes.c_void_p,ctypes.c_int64,ctypes.c_void_p,ctypes.c_int64,ctypes.c_int,ctypes.c_int,ctypes.c_int]+[ctypes.c_void_p]*6+[ctypes.c_int]
              src=ctypes.create_string_buffer(source)
              start=max(0x4000,(used+0x3fff)&~0x3fff)
              sizes=list(dict.fromkeys([B,start]+list(range(start,B+1,0x4000))))
              for size in sizes:
                  if size<used or size>B:continue
                  for fuzz,verb in [(1,0),(0,0),(1,1)]:
                      dst=ctypes.create_string_buffer(size)
                      n=fn(src,len(source),dst,size,fuzz,0,verb,None,None,None,None,None,None,3)
                      if n==size:
                          dest.write_bytes(dst.raw[:n]);print('DECODE',n);sys.exit(0)
              sys.exit(2)
          stem=os.environ['STEM'];patch=int(os.environ['PATCH']);family=int(os.environ['FAMILY'],16)
          import bisect,re
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          def http(url,off=None,n=None):
              for attempt in range(3):
                  try:
                      headers={'User-Agent':'d1-package-research/1.0'}
                      if off is not None:headers['Range']=f'bytes={off}-{off+n-1}'
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:
                          if off is not None:
                              assert r.status==206,(r.status,'expected range response')
                              assert r.headers['Content-Range'].startswith(f'bytes {off}-{off+n-1}/')
                          v=r.read()
                      if n is not None:assert len(v)==n
                      return v
                  except Exception:
                      if attempt==2:raise
                      time.sleep(1)
          index=json.loads(pathlib.Path('activity-index.json').read_bytes())
          assert index['status']=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE'
          source=index['source']
          sizes=list(map(int,source['part_sizes']))
          starts=[0]
          for n in sizes:starts.append(starts[-1]+n)
          assert hashlib.sha256(pathlib.Path('packages.txt').read_bytes()).hexdigest()==source['package_list_sha256']
          fam=index['package_families']
          members=fam.get(f'{family:04X}') or fam.get(f'{family:04x}')
          assert members
          byname={pathlib.Path(x['name']).name:x for x in members}
          def readat(off,n):
              chunks=[]
              while n:
                  part=bisect.bisect_right(starts,off)-1
                  assert 0<=part<len(sizes)
                  local=off-starts[part];take=min(n,sizes[part]-local)
                  chunks.append(http(f'{base}/packages.tar.{part+1:03d}',local,take))
                  off+=take;n-=take
              return b''.join(chunks)
          def get(p,off=None,n=None):
              name=stem+'_'+str(p)+'.pkg'
              row=byname[name];start=int(row['data_offset']);size=int(row['size'])
              if off is None:off=0;n=size
              assert 0<=off<=off+n<=size
              return readat(start+off,n)
          b=get(patch)
          pin=os.environ['PIN']
          assert hashlib.sha256(b).hexdigest()==pin,('R2 logical snapshot mismatch',hashlib.sha256(b).hexdigest())
          print('R2_LOGICAL_SNAPSHOT_MATCH',hashlib.sha256(b).hexdigest(),flush=True)
          assert H(b,0)==24 and H(b,4)==family and H(b,0x20)==patch
          ec,eo,bc,bo=U(b,0xb4),U(b,0xb8),U(b,0xd0),U(b,0xd4)
          assert eo+16*ec<=len(b) and bo+32*bc<=len(b)
          assert hashlib.sha1(b[eo:eo+16*ec]).digest()==b[0xbc:0xd0]
          assert hashlib.sha1(b[bo:bo+32*bc]).digest()==b[0xd8:0xec]
          used=[0]*bc;targets=[];needed=set()
          def spans(i):
              p=eo+i*16;q=Q(b,p+8);sz=(q>>28)&0x3fffffff;k=q&0x3fff;o=((q>>14)&0x3fff)*16
              while sz:
                  assert k<bc
                  n=min(sz,B-o);yield k,o,n;sz-=n;k+=1;o=0
          for i in range(ec):
              s=list(spans(i))
              for k,o,n in s:used[k]=max(used[k],o+n)
              if i==int(os.environ['ENTRY']) and s:
                  targets.append((i,s));needed.update(k for k,o,n in s)
          print('TARGETS',len(targets),'BLOCKS',len(needed),flush=True)
          def block(k):
              p=bo+k*32;off,n,owner,flags=struct.unpack_from('<IIHH',b,p)
              raw=get(owner,off,n) if owner!=patch else b[off:off+n]
              assert hashlib.sha1(raw).digest()==b[p+12:p+32],('SHA1',k)
              if flags==0:
                  assert len(raw)>=used[k]
                  return k,raw,None
              if flags!=1:return k,None,('flags',flags)
              with tempfile.TemporaryDirectory() as d:
                  a=pathlib.Path(d)/'stored';z=pathlib.Path(d)/'raw';a.write_bytes(raw)
                  r=subprocess.run([sys.executable,__file__,'decode',str(a),str(z),str(used[k])],capture_output=True,timeout=60)
                  if r.returncode or not z.exists():return k,None,('decode',r.returncode)
                  data=z.read_bytes()
                  assert used[k]<=len(data)<=B
                  return k,data,None
          cache={};fail={}
          with ThreadPoolExecutor(max_workers=4) as ex:
              for k,data,error in ex.map(block,sorted(needed)):
                  if error:fail[k]=error
                  else:cache[k]=data
          print('BLOCK_RESULT',len(cache),len(fail),fail,flush=True)
          assert len(targets)==int(os.environ['EXPECTED_TABLES'])
          assert len(needed)==int(os.environ['EXPECTED_BLOCKS'])
          assert not fail
          i,sp=targets[0]
          data=b''.join(cache[k][o:o+n] for k,o,n in sp)
          ref,typ,info=struct.unpack_from('<IIQ',b,eo+i*16)
          assert len(data)==(info>>28)&0x3fffffff
          print('INCIDENT_PAYLOAD',json.dumps(dict(family=f'{family:04x}',entry=i,ref=f'{ref:08x}',entry_b=f'{typ:08x}',size=len(data),sha256=hashlib.sha256(data).hexdigest(),header=data[:128].hex())),flush=True)
          def span(o,countoff,reloff,stride):
              c=Q(data,o+countoff);r=L(data,o+reloff);p=o+reloff+r+16
              assert 0<=c<=100000 and (not c or 0<=p<=p+c*stride<=len(data)),(i,o,countoff,c,p,stride,len(data))
              return c,p
          if i==6774:
              n=Q(data,0x20);p=0x38+L(data,0x28);assert n==3902 and p+n*32<=len(data)
              hashes=[U(data,p+32*j) for j in range(n)]
              assert hashlib.sha256(b''.join(struct.pack('<I',h) for h in hashes)).hexdigest()=='fa530e89c0d926d547e28ca550145b9aaea4bcf087ee9808bb44e14930224ca9'
              pathlib.Path('incident-map.json').write_text(json.dumps(hashes))
          else:
              stride={564:8,8132:56,8134:40,579:152,6771:16}[i]
              n,p=span(0,8,16,stride);out=[]
              for j in range(n):
                  o=p+j*stride;h=U(data,o)
                  row=dict(index=j,hash=f'{h:08x}')
                  if i==564:
                      row.update(incident_ordinal=H(data,o+4),secondary=H(data,o+6))
                  elif i==8132:
                      c,b=span(o,8,16,8)
                      row.update(scope=data[o+4],repeat_last=data[o+5],storage_index=struct.unpack_from('<h',data,o+0x30)[0],steps=[dict(cost=I(data,b+8*k),word=f'{U(data,b+8*k+4):08x}') for k in range(c)])
                  elif i==8134:
                      c,b=span(o,8,16,2);nc,nb=span(o,0x18,0x20,24)
                      row.update(mode=data[o+4],targets=[H(data,b+2*k) for k in range(c)],extra_counter_selectors=[dict(counter=H(data,nb+24*k),condition_raw=data[nb+24*k+8:nb+24*(k+1)].hex()) for k in range(nc)])
                  elif i==579:
                      v=o+8
                      row.update(threshold=I(data,o+4),loot=struct.unpack_from('<h',data,v)[0],tail=f'{U(data,v+0x8c):08x}')
                      fields=[('items',8,0x10,8),('progression',0x18,0x20,12),('flags',0x28,0x30,4),('counters',0x38,0x40,24),('consume',0x48,0x50,8),('presets',0x58,0x60,2),('modifiers',0x68,0x70,2),('nested',0x78,0x80,2)]
                      for name,co,ro,st in fields:
                          c,b=span(v,co,ro,st)
                          row[name]=[data[b+k*st:b+(k+1)*st].hex() for k in range(c)]
                      row['flag_ops']=[dict(index=H(bytes.fromhex(x),0),value=bytes.fromhex(x)[2]) for x in row['flags']]
                      row['progression_ops']=[dict(category=H(bytes.fromhex(x),0),amount=I(bytes.fromhex(x),4),scaled=bytes.fromhex(x)[8]) for x in row['progression']]
                      row['counter_ops']=[dict(index=H(bytes.fromhex(x),0),mode=bytes.fromhex(x)[2],expression=bytes.fromhex(x)[8:].hex()) for x in row['counters']]
                  elif i==6771:
                      v=o+8+L(data,o+8)
                      assert 0<=v<=len(data)-0xa9 and U(data,v)==h
                      r=L(data,v+0x48)
                      selectors=[]
                      if r:
                          z=v+0x48+r;c,b=span(z,0,8,24)
                          selectors=[dict(site=struct.unpack_from('<h',data,b+24*k+0x10)[0],condition_raw=data[b+24*k:b+24*k+0x10].hex()) for k in range(c)]
                      row.update(category=struct.unpack_from('<b',data,v+0xa8)[0],selectors=selectors,definition_offset=v)
                  out.append(row)
              if i==6771:
                  vals=[a['site'] for row in out for a in row['selectors']]
                  print('ACTIVITY_SELECTOR_AUDIT',json.dumps(dict(count=n,nonempty=sum(bool(x['selectors']) for x in out),selector_count=len(vals),site_counts=dict(collections.Counter(vals)),sample=[x for x in out if x['selectors']][:8])),flush=True)
              pathlib.Path(f'investment-{i}.json').write_text(json.dumps(out,indent=2))
          pathlib.Path(f'result_{family:04x}.json').write_text(json.dumps(dict(decoded_tables=1,spawn_records=0,layout_errors=0)))
          PY
          python - <<'PY'
          import json,os,subprocess,sys
          rows=json.loads(os.environ['GROUP_ROWS'])
          failed=[]
          for fam,stem,patch,pin,n,k,entry in rows:
              env=os.environ|{'FAMILY':fam,'STEM':stem,'PATCH':str(patch),'PIN':pin,'EXPECTED_TABLES':str(n),'EXPECTED_BLOCKS':str(k),'ENTRY':str(entry)}
              p=subprocess.run([sys.executable,'scan.py'],env=env)
              if p.returncode:failed.append(fam)
          print('GROUP_FAILURES',failed,flush=True)
          if not failed and os.environ['GROUP_ID']=='investment-join':
              import collections,hashlib
              h=json.load(open('incident-map.json'));c=json.load(open('investment-564.json'));p=json.load(open('investment-8132.json'));g=json.load(open('investment-8134.json'));t=json.load(open('investment-579.json'))
              ch={x['hash']:x for x in c}
              mism=[x for x in c if x['incident_ordinal']>=len(h) or h[x['incident_ordinal']]!=int(x['hash'],16)]
              missing=[x for x in t if x['hash'] not in ch]
              assert not mism and not missing and all(0<=i<len(p) for row in g for i in row['targets'])
              per=collections.Counter(x['hash'] for x in t)
