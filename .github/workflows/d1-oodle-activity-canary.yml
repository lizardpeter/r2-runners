name: D1 alpha host script prototype header field audit
on:
  push:
    branches: [research/d1-oodle-activity-canary-20261127]
permissions:
  contents: read
  statuses: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: "alpha-hostonly"
            rows: '[]'
    env:
      GH_TOKEN: ${{ github.token }}
      GROUP_ID: ${{ matrix.group }}
      GROUP_ROWS: ${{ matrix.rows }}
      LINOODLE_SKIP_DLLMAIN: "1"
    steps:
      - name: Mark canary running
        run: |
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=pending -f context="d1-full-oodle/$GROUP_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Authenticating original blocks and decoding D912"
      - name: Install previously verified Oodle 3 bridge
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll -o oo2core_3_win64.dll
          curl -fsSL --retry 3 https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so -o liblinoodle3.so
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  oo2core_3_win64.dll' | sha256sum -c
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  liblinoodle3.so' | sha256sum -c
      - name: Decompress exact source activity blocks and validate tables
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD"
          export OODLE_DLL="$PWD/oo2core_3_win64.dll"
          cat > scan.py <<'PY'
          import os,sys,ctypes,struct,hashlib,urllib.request,time,json,subprocess,tempfile,pathlib,collections
          from concurrent.futures import ThreadPoolExecutor
          B=0x40000
          U=lambda b,o:struct.unpack_from('<I',b,o)[0]
          Q=lambda b,o:struct.unpack_from('<Q',b,o)[0]
          H=lambda b,o:struct.unpack_from('<H',b,o)[0]
          I=lambda b,o:struct.unpack_from('<i',b,o)[0]
          L=lambda b,o:struct.unpack_from('<q',b,o)[0]
          if len(sys.argv)>1 and sys.argv[1]=='decode':
              source=pathlib.Path(sys.argv[2]).read_bytes()
              dest=pathlib.Path(sys.argv[3])
              used=int(sys.argv[4])
              dll=ctypes.CDLL(os.path.abspath('liblinoodle3.so'))
              fn=dll.OodleLZ_Decompress
              fn.restype=ctypes.c_int64
              fn.argtypes=[ctypes.c_void_p,ctypes.c_int64,ctypes.c_void_p,ctypes.c_int64,ctypes.c_int,ctypes.c_int,ctypes.c_int]+[ctypes.c_void_p]*6+[ctypes.c_int]
              src=ctypes.create_string_buffer(source)
              start=max(0x4000,(used+0x3fff)&~0x3fff)
              sizes=list(dict.fromkeys([B,used]+[((used+a-1)//a)*a for a in (16,128,512,4096,16384)]+list(range(start,B+1,0x4000))))
              for size in sizes:
                  if size<used or size>B:continue
                  for fuzz,verb in [(1,0),(0,0),(1,1)]:
                      dst=ctypes.create_string_buffer(size)
                      n=fn(src,len(source),dst,size,fuzz,0,verb,None,None,None,None,None,None,3)
                      if n==size:
                          dest.write_bytes(dst.raw[:n]);print('DECODE',n);sys.exit(0)
              sys.exit(2)
          import re, tarfile
          url='https://crypt.cohae.dev/destiny/360_internal_alpha/packages.tar'
          def readat(o,n):
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'Range':f'bytes={o}-{o+n-1}','User-Agent':'d1-package-research/1.0'})
                      with urllib.request.urlopen(req,timeout=90) as res:
                          assert res.status==206 and res.headers['Content-Range'].startswith(f'bytes {o}-{o+n-1}/')
                          v=res.read()
                      assert len(v)==n
                      return v
                  except Exception:
                      if attempt==2:raise
                      time.sleep(1)
          listing=subprocess.check_output(['curl','-fsSL','--retry','2',url.rsplit('/',1)[0]+'/packages.txt'])
          print('ALPHA_MANIFEST_OK',len(listing),hashlib.sha256(listing).hexdigest(),flush=True)
          names={s.strip() for s in listing.decode().splitlines() if s.strip()}
          assert len(names)==133
          # Tar header-only census; each valid header verifies its own checksum.
          members={};o=0
          while o<1904760832:
              h=readat(o,512)
              if h==bytes(512):break
              t=tarfile.TarInfo.frombuf(h,'utf-8','strict')
              if t.isfile():members[pathlib.PurePosixPath(t.name).name]=(o+512,t.size)
              o+=512+((t.size+511)//512)*512
          assert set(members)==names,(len(members),len(names),list(names-set(members))[:10])
          print('ALPHA_INDEX',json.dumps(dict(entries=len(members),archive_bytes=1904760832,manifest_sha256=hashlib.sha256(listing).hexdigest(),headers_end=o,hostonly=[n for n in members if 'hostonly' in n])),flush=True)
          be16=lambda b,o:struct.unpack_from('>H',b,o)[0]
          be32=lambda b,o:struct.unpack_from('>I',b,o)[0]
          be64=lambda b,o:struct.unpack_from('>Q',b,o)[0]
          targets=[n for n in members if n=='360_hostonly_venus_0cdc_0.pkg']
          print('ALPHA_TARGETS',json.dumps([[n,members[n][1]] for n in targets]),flush=True)
          for name in targets:
              off,size=members[name]
              b=readat(off,size)
              ver=be16(b,0);fam=be16(b,4);patch=be16(b,6)
              if ver!=11:
                  print('ALPHA_UNSUPPORTED',name,ver,flush=True);continue
              ec,eo,bc,bo=be32(b,0x100),be32(b,0x104),be32(b,0x11c),be32(b,0x120)
              assert eo+16*ec<=len(b) and bo+32*bc<=len(b)
              etok=hashlib.sha1(b[eo:eo+16*ec]).digest()==b[0x108:0x11c]
              btok=hashlib.sha1(b[bo:bo+32*bc]).digest()==b[0x124:0x138]
              used=[0]*bc;owners=collections.defaultdict(list)
              for i in range(ec):
                  ref,typ,info=struct.unpack_from('>IIQ',b,eo+i*16);s=(info>>28)&0x3fffffff;k=info&0x3fff;z=((info>>14)&0x3fff)*16
                  while s:
                      assert k<bc
                      n=min(s,B-z);used[k]=max(used[k],z+n);owners[k].append((z,z+n,i,ref,typ));s-=n;k+=1;z=0
              def block(k):
                  p=bo+k*32;ofs,n,flags,owner=struct.unpack_from('>IIHH',b,p)
                  raw=b[ofs:ofs+n]
                  if len(raw)!=n:return k,None,'short',False
                  ok=hashlib.sha1(raw).digest()==b[p+12:p+32]
                  if not flags&1:return k,raw,None,ok
                  with tempfile.TemporaryDirectory() as d:
                      a=pathlib.Path(d)/'in';z=pathlib.Path(d)/'out';a.write_bytes(raw)
                      r=subprocess.run([sys.executable,__file__,'decode',str(a),str(z),str(used[k])],capture_output=True,timeout=60)
                      if r.returncode or not z.exists():return k,None,'decode',ok
                      return k,z.read_bytes(),None,ok
              assert hashlib.sha256(b).hexdigest()=='c11d1e12ac873cd7d0c1b30a7ce3d072767965cb99a6b42387ff647b218fa6b0'
              print('ALPHA_BLOCK_METADATA',json.dumps(dict(entry_sha1=b[0x108:0x11c].hex(),block_sha1=b[0x124:0x138].hex(),rows=[dict(index=k,offset=be32(b,bo+k*32),stored_size=be32(b,bo+k*32+4),flags=be16(b,bo+k*32+8),owner=be16(b,bo+k*32+10),sha1=b[bo+k*32+12:bo+k*32+32].hex(),used=used[k]) for k in range(bc)])),flush=True)
              cache={};fail=[]
              with ThreadPoolExecutor(max_workers=3) as ex:
                  for k,data,error,ok in ex.map(block,range(bc)):
                      if error:fail.append([k,error])
                      else:cache[k]=data
              print('ALPHA_BLOCK_DECODE',json.dumps(dict(decoded={str(k):len(v) for k,v in cache.items()},failed=fail)),flush=True)
              class Bad(Exception):pass
              def parse(chunk):
                  o=0;out=[];const_total=0
                  def take(n):
                      nonlocal o
                      if n<0 or o+n>len(chunk):raise Bad(f'bounds@{o}:{n}')
                      v=chunk[o:o+n];o+=n;return v
                  def be():return int.from_bytes(take(4),'big')
                  def count(n):
                      v=be()
                      if v>n:raise Bad(f'count@{o-4}:{v}>{n}')
                      return v
                  def st():
                      n=count(65536);v=take(n)
                      if n and v[-1]!=0:raise Bad(f'string terminator@{o-1}')
                      return v.rstrip(b'\x00').decode('utf8','strict')
                  if take(14)[:6]!=b'\x1bLua\x51\x0e':raise Bad('header')
                  if count(64)!=13:raise Bad('type count')
                  for j in range(13):
                      if be()!=j:raise Bad('type index')
                      n=st()
                      if not re.fullmatch(r'T[A-Z0-9_]+',n):raise Bad('type name')
                  def proto(depth):
                      nonlocal o,const_total
                      if depth>32 or len(out)>10000:raise Bad('depth')
                      start=o;unknown=None
                      if depth:unknown=be();up=count(256);params=count(256);var=take(1)[0];ic=count(100000)
                      else:up=count(256);params=count(256);var=take(1)[0];slots=count(1024);ic=count(100000)
                      # Child byte at +12 has not been semantically established; retain raw value.
                      if not depth and var not in (0,1,2,3,4):raise Bad(f'root header byte@{start}:{var}')
                      take((-o)%4)
                      words=[be() for j in range(ic)];ops=[w>>25 for w in words]
                      if any(op>91 for op in ops):raise Bad(f'opcode@{start}:{max(ops)}')
                      nc=count(100000);const_total+=nc;strings={};consts=[]
                      for j in range(nc):
                          t=take(1)[0];v=None
                          if t==0:pass
                          elif t==1:v=take(1)[0]
                          elif t in (2,11):v=take(8).hex()
                          elif t==3:v=struct.unpack('>f',take(4))[0]
                          elif t==4:
                              v=st()
                              if re.fullmatch(r'[A-Za-z_@][A-Za-z_0-9./\\:@ -]{0,180}',v):strings[j]=v
                          else:raise Bad(f'constant@{o-1}:{t}')
                          consts.append([t,v])
                      debug=be()
                      if debug not in (0,1):raise Bad(f'debug@{o-4}:{debug}')
                      path=name='';local=[];uv=[];lines=[];first=last=0
                      if debug:
                          lc=count(100000);ln=count(8192);un=count(8192);first=be();last=be()
                          path=st();name=st();lines=[be() for j in range(lc)]
                          if lc!=ic:raise Bad(f'line mismatch@{start}:{lc}!={ic}')
                          for j in range(ln):
                              n=st();a=be();z=be()
                              if a>z or z>ic+1:raise Bad(f'local range@{start}:{a},{z}')
                              local.append(n)
                          uv=[st() for j in range(un)]
                      kids=count(10000)
                      bindings=[]
                      for j,w in enumerate(words):
                          if w>>25!=66:continue
                          child=(w>>8)&0x1ffff
                          for z in range(j+1,min(j+10,len(words))):
                              v=words[z];op=v>>25
                              if op==76:continue
                              if op in (15,74):
                                  k=(v>>17)&255
                                  if k in strings:bindings.append([child,strings[k],j,z])
                              break
                      idx=len(out);out.append(dict(index=idx,start=start,end=o,depth=depth,unknown=unknown,up=up,params=params,var=var,header=chunk[start:start+17].hex(),instructions=ic,constants=nc,debug=debug,path=path,name=name,lines=[first,last],locals=local,upvalues=uv,children=kids,bindings=bindings,identifiers=list(strings.values()),opcodes=dict(collections.Counter(ops))))
                      for j in range(kids):proto(depth+1)
                  err=None
                  try:proto(0)
                  except (Bad,UnicodeError,struct.error) as e:err=str(e)
                  return dict(ok=err is None,error=err,cursor=o,functions=out,constants=const_total)
              programs=[];coverage=collections.Counter();all_entries=[]
              for i in range(ec):
                  ref,typ,info=struct.unpack_from('>IIQ',b,eo+i*16);size=(info>>28)&0x3fffffff;k=info&0x3fff;z=((info>>14)&0x3fff)*16
                  s=size;parts=[]
                  while s:
                      n=min(s,B-z)
                      if k not in cache or z+n>len(cache[k]):parts=None;break
                      parts.append(cache[k][z:z+n]);s-=n;k+=1;z=0
                  if parts is None:
                      coverage['unavailable_entries']+=1;continue
                  data=b''.join(parts);coverage['entries']+=1;coverage['entry_bytes']+=len(data)
                  for m in re.finditer(rb'\x1bLua\x51\x0e',data):
                      q=m.start()
                      try:res=parse(data[q:])
                      except (Bad,UnicodeError,struct.error) as e:res=dict(ok=False,error=str(e),cursor=0,functions=[],constants=0)
                      fs=res.pop('functions');root=fs[0] if fs else {}
                      n=dict(entry=i,ref=f'{ref:08x}',size=size,offset=q,entry_sha256=hashlib.sha256(data).hexdigest(),**res,prototype_count=len(fs),instruction_words=sum(f['instructions'] for f in fs),path=root.get('path',''),root_bindings=root.get('bindings',[]),functions=[{k:v for k,v in f.items() if k not in ('opcodes',)} for f in fs])
                      coverage['candidates']+=1;coverage['complete']+=res['ok'];coverage['prototypes']+=len(fs);coverage['instruction_words']+=n['instruction_words']
                      programs.append(n)
                      summary={k:v for k,v in n.items() if k!='functions'}
                      print('ALPHA_SCRIPT',json.dumps(summary,separators=(',',':')),flush=True)
                      for f in fs:
                          if not f['depth'] or f['bindings']:print('ALPHA_PROTOTYPE',json.dumps(dict(entry=i,**f),separators=(',',':')),flush=True)
              print('ALPHA_PARSE_SUMMARY',json.dumps(dict(package_sha256=hashlib.sha256(b).hexdigest(),coverage=coverage,errors=collections.Counter(n['error'] for n in programs if n['error']),paths=[n['path'] for n in programs if n['ok']],complete_extent_bytes=sum(n['cursor'] for n in programs if n['ok']),failed_blocks=fail)),flush=True)
              pathlib.Path('alpha-script-research.json').write_text(json.dumps(programs,separators=(',',':')))
          print('ALPHA_COMPLETE',len(targets),flush=True)
          PY
          python scan.py
      - name: Publish research status (no raw package uploads)
        if: always()
        run: |
          state=success
          if [ "${{ job.status }}" != success ]; then state=failure; fi
          desc="Full logical block script census"
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context="d1-full-oodle/$GROUP_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="$desc"

      - name: Upload normalized script metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-host-script-research
          path: alpha-script-research.json
