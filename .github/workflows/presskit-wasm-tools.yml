name: Public WASM target and binding tools handoff
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/presskit-wasm-tools.yml']
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get matching public WASM standard library
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wasm-tools"
          cd "$RUNNER_TEMP/wasm-tools"
          curl -fLsS --retry 3 -O https://static.rust-lang.org/dist/rust-std-1.100.0-wasm32-unknown-unknown.tar.xz
          curl -fLsS --retry 3 -O https://static.rust-lang.org/dist/rust-std-1.100.0-wasm32-unknown-unknown.tar.xz.sha256
          sha256sum -c rust-std-1.100.0-wasm32-unknown-unknown.tar.xz.sha256
      - name: Get matching wasm-bindgen executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wasm-tools"
          gh release download 0.2.130 --repo wasm-bindgen/wasm-bindgen --pattern 'wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz'
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-public-tools
          path: ${{ runner.temp }}/wasm-tools
          retention-days: 7
          compression-level: 0
