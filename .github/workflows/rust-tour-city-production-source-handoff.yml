name: Rust Tour licensed city source asset handoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rust-tour-city-production-source-handoff.yml']
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Transfer public CC0 sources only (no building or testing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tour-source"
          cd "$RUNNER_TEMP/tour-source"
          python3 - <<'PY'
          import json, urllib.request, pathlib, concurrent.futures
          root=pathlib.Path('.')
          sources=[]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'RustTourAssetPipeline/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r: return r.read()
          def download(url,path):
              dest=root/path
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(get(url))
              return {'path':path,'url':url,'bytes':dest.stat().st_size}
          def poly(asset, kinds, resolution):
              meta=json.loads(get('https://api.polyhaven.com/files/'+asset))
              out=[]
              (root/asset).mkdir(exist_ok=True)
              (root/asset/'source.json').write_text(json.dumps(meta,indent=2))
              for kind in kinds:
                  variants=meta.get(kind,{}).get(resolution,{})
                  item=next((variants[k] for k in ('hdr','jpg','png','exr') if k in variants),None)
                  if item:
                      url=item['url']
                      out.append(download(url,asset+'/'+url.rsplit('/',1)[-1]))
              return out
          tasks=[
              ('walker',lambda:[download('https://grab3d.com/dl/man-rigged/man-rigged.glb','casual-man/model.glb'),download('https://grab3d.com/dl/man/LICENSE.txt','casual-man/LICENSE.txt'),download('https://grab3d.com/dl/man/manifest.json','casual-man/manifest.json')]),
              ('cesium-test',lambda:[download('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb','cesium-test/model.glb'),download('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/README.md','cesium-test/README.md')]),
              ('street',lambda:poly('wide_street_01',['hdri'],'2k')),
              ('pavement',lambda:poly('pavement_01',['Diffuse','nor_gl','Rough','AO'],'2k')),
              ('asphalt',lambda:poly('worn_asphalt',['Diffuse','nor_gl','Rough','AO'],'2k')),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              jobs={ex.submit(fn):name for name,fn in tasks}
              for fut in concurrent.futures.as_completed(jobs):
                  try: sources+=fut.result()
                  except Exception as e: print(jobs[fut],repr(e))
          (root/'source_manifest.json').write_text(json.dumps(sources,indent=2))
          (root/'LICENSES.md').write_text('Poly Haven: CC0 1.0 (https://polyhaven.com/license). Casual Man: CC0 1.0 AI-assisted (https://grab3d.com/models/characters/man/). Cesium Man: CC BY 4.0, Cesium 2017, see README; test fixture only, not production art.\n')
          if not sources: raise RuntimeError('all transfers failed')
          PY
          find . -type f ! -name 'SHA256SUMS.tmp' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tour-licensed-city-source
          path: ${{ runner.temp }}/tour-source/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
