name: Fortnite 5.41 authenticated R2 source lab

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fortnite541-retail-lab.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "Original 5.41 source family (all runs independently)"
        type: choice
        required: true
        default: poi
        options: [poi, terrain, foliage, sky, all]

permissions:
  contents: read

concurrency:
  group: r2-fortnite541-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  FORTNITE_REVERSE_REF: 0742a8de70e692d9a994d50480fbce27905f0156

jobs:
  # Public, pinned source parser; private Rust-test is never checked out.
  # The entire verified original file set MUST be delivered as an artifact.
  poi-native-source:
    if: github.event_name == 'push' || inputs.scope == 'poi' || inputs.scope == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout authenticated public source parser
        uses: actions/checkout@v4
        with:
          repository: lizardpeter/Fortnite-reverse
          ref: ${{ env.FORTNITE_REVERSE_REF }}
          persist-credentials: false
      - name: Compile and test public source parser
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/fortnite_541/Cargo.toml --all-targets
          cargo build --release --manifest-path crates/fortnite_541/Cargo.toml --bin athena_poi_actor_frontier
      - name: Download only SHA1-authenticated original REC, Warehouses and Pueblo world dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fortnite541-poi-report"
          python3 crates/fortnite_541/tools/fetch_remote_541_dependencies.py --scope poi \
            --destination "$RUNNER_TEMP/fortnite541-poi" \
            2>&1 | tee "$RUNNER_TEMP/fortnite541-poi-report/source-download.log"
      - name: Audit nested original 3x3, 5x5, 7x12 building world actors
        run: |
          set -euo pipefail
          ./crates/fortnite_541/target/release/athena_poi_actor_frontier \
            "$RUNNER_TEMP/fortnite541-poi" \
            2>&1 | tee "$RUNNER_TEMP/fortnite541-poi-report/native-actor-frontier.log"
          python3 crates/fortnite_541/tools/report_public_asset_probe.py \
            --scope poi --source-root "$RUNNER_TEMP/fortnite541-poi" \
            --output "$RUNNER_TEMP/fortnite541-poi-report/source-inventory.json"
      - name: Write exact-source byte inventory, even if parser failed
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path(os.environ["RUNNER_TEMP"]) / "fortnite541-poi"
          report = Path(os.environ["RUNNER_TEMP"]) / "fortnite541-poi-report"
          report.mkdir(parents=True, exist_ok=True)
          files = []
          for path in sorted(root.rglob("*")) if root.exists() else []:
              if not path.is_file():
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as fp:
                  for block in iter(lambda: fp.read(1024 * 1024), b""):
                      digest.update(block)
              files.append({"path": path.relative_to(root).as_posix(), "bytes": path.stat().st_size, "sha256": digest.hexdigest()})
          (report / "exact-source-files.json").write_text(json.dumps({"status": "file_inventory_not_a_completeness_guarantee", "files": files}, indent=2) + "\n")
          print(f"Exact downloaded original files available for artifact handoff: {len(files)}")
          PY
      - name: Deliver original source files with their exact paths and bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-poi-exact-source-${{ github.run_id }}
          path: ${{ runner.temp }}/fortnite541-poi/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Deliver companion validation diagnostics and file checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-poi-source-report-${{ github.run_id }}
          path: ${{ runner.temp }}/fortnite541-poi-report/
          if-no-files-found: warn
          retention-days: 90

  other-native-sources:
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'terrain' || inputs.scope == 'foliage' || inputs.scope == 'sky' || inputs.scope == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        scope: [terrain, foliage, sky]
    steps:
      - name: Filter requested source family
        id: selected
        env:
          SCOPE: ${{ inputs.scope }}
          FAMILY: ${{ matrix.scope }}
        run: |
          if [[ "$SCOPE" == all || "$SCOPE" == "$FAMILY" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.selected.outputs.run == 'true'
        with:
          repository: lizardpeter/Fortnite-reverse
          ref: ${{ env.FORTNITE_REVERSE_REF }}
          persist-credentials: false
      - name: Authenticate source packages and run family-specific probe
        if: steps.selected.outputs.run == 'true'
        env:
          FAMILY: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fortnite541-$FAMILY-report"
          root="$RUNNER_TEMP/fortnite541-$FAMILY"
          report="$RUNNER_TEMP/fortnite541-$FAMILY-report"
          manifest=crates/fortnite_541/Cargo.toml
          if [[ "$FAMILY" == terrain ]]; then
            python3 crates/fortnite_541/tools/fetch_athena_541.py \
              --all-landscape --with-terrain-materials --destination "$root" \
              2>&1 | tee "$report/download.log"
            cargo run --release --manifest-path "$manifest" --bin athena_surface_probe -- "$root" | tee "$report/geometry.log"
            cargo run --release --manifest-path "$manifest" --bin athena_material_graph_probe -- "$root" | tee "$report/material.log"
          else
            python3 crates/fortnite_541/tools/fetch_remote_541_dependencies.py \
              --scope "$FAMILY" --destination "$root" 2>&1 | tee "$report/download.log"
            if [[ "$FAMILY" == foliage ]]; then
              cargo run --release --manifest-path "$manifest" --bin athena_foliage_material_probe -- "$root" | tee "$report/foliage-material.log"
              cargo run --release --manifest-path "$manifest" --bin athena_foliage_alpha_probe -- "$root" | tee "$report/foliage-alpha.log"
            else
              cargo run --release --manifest-path "$manifest" --bin athena_remote_source_probe -- "$root" | tee "$report/sky-todm.log"
            fi
          fi
          python3 crates/fortnite_541/tools/report_public_asset_probe.py \
            --scope "$FAMILY" --source-root "$root" --output "$report/source-inventory.json"
      - name: Inventory exact original file bytes and SHA-256
        if: always() && steps.selected.outputs.run == 'true'
        env:
          FAMILY: ${{ matrix.scope }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          family = os.environ["FAMILY"]
          root = Path(os.environ["RUNNER_TEMP"]) / f"fortnite541-{family}"
          report = Path(os.environ["RUNNER_TEMP"]) / f"fortnite541-{family}-report"
          report.mkdir(parents=True, exist_ok=True)
          files = []
          for path in sorted(root.rglob("*")) if root.exists() else []:
              if not path.is_file():
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as fp:
                  for block in iter(lambda: fp.read(1024 * 1024), b""):
                      digest.update(block)
              files.append({"path": path.relative_to(root).as_posix(), "bytes": path.stat().st_size, "sha256": digest.hexdigest()})
          (report / "exact-source-files.json").write_text(json.dumps({"status": "file_inventory_not_a_completeness_guarantee", "files": files}, indent=2) + "\n")
          print(f"Exact {family} source files available for artifact handoff: {len(files)}")
          PY
      - name: Deliver all acquired source files unchanged
        if: always() && steps.selected.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-${{ matrix.scope }}-exact-source-${{ github.run_id }}
          path: ${{ runner.temp }}/fortnite541-${{ matrix.scope }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Deliver companion source reports and checksums
        if: always() && steps.selected.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-${{ matrix.scope }}-source-report-${{ github.run_id }}
          path: ${{ runner.temp }}/fortnite541-${{ matrix.scope }}-report/
          if-no-files-found: warn
          retention-days: 90
