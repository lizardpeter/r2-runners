name: Metro V2 17559 exact-source handoff

on:
  workflow_dispatch:
  push:
    branches:
      - metro-v2-17559-handoff-20261124
    paths:
      - "metro-v2-trigger.txt"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout R2 runner tools
        uses: actions/checkout@v4

      - name: Resolve R2 custom domain through Cloudflare edge
        shell: bash
        run: |
          echo "104.18.54.45 r2.houseofkublai.com" | sudo tee -a /etc/hosts
          echo "104.18.55.45 r2.houseofkublai.com" | sudo tee -a /etc/hosts
          getent hosts r2.houseofkublai.com

      - name: Retrieve exact Metro V2 source objects from R2
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import quote

          sys.path.insert(0, "scripts")
          from r2_download import download, validate_key

          base = "https://r2.houseofkublai.com"
          output = Path("handoff")
          output.mkdir(parents=True, exist_ok=True)

          sources = [
              {
                  "key": "x360/Xbox360-Metro-V2-17559/J-Runner-with-Extras.zip",
                  "bytes": 233430403,
                  "sha256": "E8B01B60827F3012F4C3D7A5E6DC7F09DCE3BD028EAE67AC34CA8E1EFE81941B",
              },
              {
                  "key": "x360/Xbox360-Metro-V2-17559/SystemUpdate_17559_USB.zip",
                  "bytes": 115992188,
                  "sha256": "38885A3AB6B9854FB4FA31D5DDF21A4FDDFD4CFB25E219060CFB0C2FB31F208F",
              },
              {
                  "key": "x360/Xbox360-Metro-V2-17559/xeBuild_1.21.zip",
                  "bytes": 1296437,
                  "sha256": "51B588FD44219A59F8B305FA8D824770FEBAB5A0A30BAE8D1ACED38379471E9E",
              },
              {
                  "key": "x360/Xbox360-Metro-V2-17559/dashboard-archive/dash.xex",
                  "bytes": 5971968,
                  "sha256": "3AD8F38D070EAF63CADAC0697E3E8802C565CBFD0825A485347C5D718014F927",
              },
              {
                  "key": "x360/Xbox360-Metro-V2-17559/dashboard-archive/dashbigger.xex",
                  "bytes": 15880192,
                  "sha256": "FC4AD90638A8FFF7759734DEE364A48964E164D567699CA7E7ACA2DC06EBC8C2",
              },
              {
                  "key": "x360/Xbox360-Metro-V2-17559/dashboard-archive/shrdres.xzp",
                  "bytes": 223911,
                  "sha256": "179C5BE167402297C6E137C08FEFE3146F6F497964DC2BDA94812596FC9AEFE0",
              },
              {
                  "key": "x360/Xbox360-Metro-V2-17559/SystemUpdate_17559_USB/$SystemUpdate/su20076000_00000000",
                  "bytes": 11862016,
                  "sha256": "8119312192AD3AC41345336C6302A97BC471AF2AB6689F04FFE92E9E07BC7C45",
              }
          ]

          results = []
          errors = []
          for item in sources:
              key = validate_key(item["key"])
              url = base + "/" + quote(key, safe="/")
              dest = output / key
              dest.parent.mkdir(parents=True, exist_ok=True)
              try:
                  count, digest, content_type = download(url, dest)
                  row = {
                      "key": key,
                      "artifact_path": dest.as_posix(),
                      "bytes": count,
                      "sha256": digest.upper(),
                      "content_type": content_type,
                      "expected_bytes": item["bytes"],
                      "expected_sha256": item["sha256"],
                      "size_ok": count == item["bytes"],
                      "sha256_ok": item["sha256"] is None or digest.upper() == item["sha256"],
                  }
                  results.append(row)
                  print(json.dumps(row))
                  if not row["size_ok"] or not row["sha256_ok"]:
                      errors.append({"key": key, "error": "size or SHA-256 mismatch"})
              except Exception as exc:
                  errors.append({"key": key, "error": repr(exc)})
                  print(f"FAILED {key}: {exc}", file=sys.stderr)

          report = {
              "scope": "Xbox 360 Metro V2 retail dashboard 2.0.17559.0",
              "source": "Cloudflare R2 public origin",
              "complete": not errors and len(results) == len(sources),
              "objects_requested": len(sources),
              "objects_downloaded": len(results),
              "results": results,
              "errors": errors,
          }
          (output / "verification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          (output / "README.txt").write_text(
              "Metro V2 17559 exact-source handoff\n"
              "===================================\n"
              "All downloaded objects retain their original R2 key-relative paths.\n"
              "verification.json records byte counts, SHA-256 hashes, and expected values.\n"
              "The ZIP archives are original source packages; no binaries are rewritten.\n"
              "The PIRS update is also included as a separate object for direct extraction.\n",
              encoding="utf-8",
          )
          if errors:
              raise SystemExit(f"{len(errors)} R2 source downloads or validations failed")
          PY

      - name: Download x360-native v1.34.6 source and Linux x64 reference build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/reference/x360-native
          cd handoff/reference/x360-native
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 1200 \\
            --output x360-native-v1.34.6-source.zip \\
            https://github.com/fabegalo/x360-native/archive/refs/tags/v1.34.6.zip
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 1200 \\
            --output rexglue-sdk-f5337cdc.zip \\
            https://github.com/rexglue/rexglue-sdk/archive/f5337cdc947ff6d4c4196737e2c807a48f2a1fc2.zip
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 1200 \\
            --output x360-native-1.34.6-linux-x64.tar.gz \\
            https://github.com/fabegalo/x360-native/releases/download/v1.34.6/x360-native-1.34.6-linux-x64.tar.gz
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path(".")
          expected={"x360-native-1.34.6-linux-x64.tar.gz":69370937}
          rows=[]
          for p in sorted(x for x in root.iterdir() if x.is_file()):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(4*1024*1024),b""): h.update(c)
              size=p.stat().st_size
              rows.append({"file":p.name,"bytes":size,"sha256":h.hexdigest().upper(),
                           "expected_bytes":expected.get(p.name),
                           "size_ok":p.name not in expected or size==expected[p.name]})
          (root/"verification.json").write_text(json.dumps({
              "project":"fabegalo/x360-native","tag":"v1.34.6",
              "rexglue_sdk_commit":"f5337cdc947ff6d4c4196737e2c807a48f2a1fc2",
              "files":rows
          },indent=2)+"\\n")
          print(json.dumps(rows,indent=2))
          if any(not r["size_ok"] for r in rows): raise SystemExit("size verification failed")
          PY
          cat > README.txt <<'EOF'
          x360-native v1.34.6 reference package
          ====================================
          BSD-3-Clause external research project, downloaded as a reference.
          The source ZIP omits Git submodules; rexglue-sdk is included at the exact
          commit recorded by x360-native tag v1.34.6. Linux x64 release is included.
          Original Microsoft dashboard binaries are not included in this reference.
          See verification.json for exact sizes and SHA-256 hashes.
          EOF

      - name: Upload exact original source files and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-v2-17559-exact-source
          path: handoff/
          if-no-files-found: error
          retention-days: 90
