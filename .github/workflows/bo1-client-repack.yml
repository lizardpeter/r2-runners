name: BO1 original client binary transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bo1-client-repack.yml"
      - "scripts/shard_original_assets.py"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed BO1 full-game run containing the complete client binary artifact"
        required: true
        default: "39636384741"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  retain-client-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download complete existing source binaries from BO1 runner
        uses: actions/download-artifact@v4
        with:
          name: bo1-original-client-files-${{ inputs.source_run_id || '39636384741' }}
          run-id: ${{ inputs.source_run_id || '39636384741' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bo1-client-original
      - name: Repackage each full source file into byte-exact transferable shards
        run: |
          python3 scripts/shard_original_assets.py \
            --source "$RUNNER_TEMP/bo1-client-original" \
            --target "$RUNNER_TEMP/bo1-client-transfer"
      - name: Preserve original client data shard 00
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-00
          path: ${{ runner.temp }}/bo1-client-transfer/part-00/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 01
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-01
          path: ${{ runner.temp }}/bo1-client-transfer/part-01/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 02
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-02
          path: ${{ runner.temp }}/bo1-client-transfer/part-02/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 03
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-03
          path: ${{ runner.temp }}/bo1-client-transfer/part-03/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 04
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-04
          path: ${{ runner.temp }}/bo1-client-transfer/part-04/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 05
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-05
          path: ${{ runner.temp }}/bo1-client-transfer/part-05/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 06
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-06
          path: ${{ runner.temp }}/bo1-client-transfer/part-06/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 07
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-07
          path: ${{ runner.temp }}/bo1-client-transfer/part-07/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 08
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-08
          path: ${{ runner.temp }}/bo1-client-transfer/part-08/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 09
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-09
          path: ${{ runner.temp }}/bo1-client-transfer/part-09/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 10
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-10
          path: ${{ runner.temp }}/bo1-client-transfer/part-10/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve original client data shard 11
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-part-11
          path: ${{ runner.temp }}/bo1-client-transfer/part-11/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Publish byte-exact transfer hashes and original paths
        uses: actions/upload-artifact@v4
        with:
          name: bo1-complete-client-${{ github.run_id }}-integrity
          path: ${{ runner.temp }}/bo1-client-transfer/transfer-manifest.json
          if-no-files-found: error
          retention-days: 90
