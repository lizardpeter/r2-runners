name: T6 original IPAK texture source handoff

# Full original archives are downloaded and verified before transport.
# base.ipak is split ONLY at the artifact transport boundary; reassemble
# consecutive numbered parts byte-for-byte and verify the published SHA256.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t6-material-ipak-source.yml"
      - "scripts/r2_download.py"
      - "scripts/r2_range_download.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    name: ${{ matrix.archive }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        archive: [mp, patch_mp, base, dlc0_load_mp]
    steps:
      - uses: actions/checkout@v4
      - name: Source metadata
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          case "$ARCHIVE" in
            mp) expected=348651520 ;;
            patch_mp) expected=56623104 ;;
            base) expected=2614362112 ;;
            dlc0_load_mp) expected=688128 ;;
            *) exit 1 ;;
          esac
          echo "SOURCE_KEY=bo2/zone/all/$ARCHIVE.ipak" >> "$GITHUB_ENV"
          echo "SOURCE_BYTES=$expected" >> "$GITHUB_ENV"
      - name: Download entire non-base R2 image package
        if: matrix.archive != 'base'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r2_download.py \
            --base-url https://r2.houseofkublai.com \
            --key "$SOURCE_KEY" \
            --output-dir "$RUNNER_TEMP/t6" \
            --expected-size "$SOURCE_BYTES"
          FILE="$RUNNER_TEMP/t6/artifact/$SOURCE_KEY"
          test "$(stat -c%s "$FILE")" -eq "$SOURCE_BYTES"
          sha256sum "$FILE" | tee "$RUNNER_TEMP/t6/full-object.sha256"
      - name: Retrieve complete base.ipak with exact byte ranges
        if: matrix.archive == 'base'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r2_range_download.py \
            --base-url https://r2.houseofkublai.com \
            --key "$SOURCE_KEY" \
            --output-dir "$RUNNER_TEMP/t6" \
            --expected-size "$SOURCE_BYTES"
          cd "$RUNNER_TEMP/t6/base-parts"
          test "$(find . -name 'base.ipak.part-*' | wc -l)" -eq 4
          sha256sum --check parts.sha256
          cat base.ipak.part-* | sha256sum
          cat > README.txt <<'EOS'
          This 2.61 GB retail base.ipak was fetched in complete, verified HTTP
          byte ranges because single-object HTTP responses truncate upstream.
          Parts are consecutive byte-for-byte source slices. Reassemble:
              cat base.ipak.part-* > base.ipak
              sha256sum -c full-object.sha256
          EOS
      - name: Publish exact non-base object
        if: matrix.archive != 'base'
        uses: actions/upload-artifact@v4
        with:
          name: t6-${{ matrix.archive }}-ipak-exact-source
          path: ${{ runner.temp }}/t6/artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish base archive part 00
        if: matrix.archive == 'base'
        uses: actions/upload-artifact@v4
        with:
          name: t6-base-ipak-part-00
          path: ${{ runner.temp }}/t6/base-parts/base.ipak.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish base archive part 01
        if: matrix.archive == 'base'
        uses: actions/upload-artifact@v4
        with:
          name: t6-base-ipak-part-01
          path: ${{ runner.temp }}/t6/base-parts/base.ipak.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish base archive part 02
        if: matrix.archive == 'base'
        uses: actions/upload-artifact@v4
        with:
          name: t6-base-ipak-part-02
          path: ${{ runner.temp }}/t6/base-parts/base.ipak.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish base archive part 03
        if: matrix.archive == 'base'
        uses: actions/upload-artifact@v4
        with:
          name: t6-base-ipak-part-03
          path: ${{ runner.temp }}/t6/base-parts/base.ipak.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish base archive integrity manifest
        if: matrix.archive == 'base'
        uses: actions/upload-artifact@v4
        with:
          name: t6-base-ipak-reassembly-manifest
          path: |
            ${{ runner.temp }}/t6/base-parts/README.txt
            ${{ runner.temp }}/t6/base-parts/full-object.sha256
            ${{ runner.temp }}/t6/base-parts/parts.sha256
            ${{ runner.temp }}/t6/base-parts/verification.json
          if-no-files-found: error
          retention-days: 30
