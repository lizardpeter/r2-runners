name: IW5 local export tools and verified textures
on:
  push:
    paths:
      - '.github/workflows/iw5-local-export-tools-textures.yml'
  workflow_dispatch:
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select and verify original archive members
        env:
          SELECTION: ''
        run: python scripts/iw5_local_export_textures.py
      - name: Encrypt for local import
        run: |
          set -euo pipefail
          mkdir artifact
          printf '%s' '' | base64 -d > transfer.der
          openssl pkey -pubin -inform DER -in transfer.der -out transfer.pub
          openssl rand -hex 32 > transfer.pass
          openssl pkeyutl -encrypt -pubin -inkey transfer.pub -pkeyopt rsa_padding_mode:oaep -in transfer.pass -out artifact/transfer.pass.rsa
          tar -cf textures.tar bundle
          sha256sum textures.tar > artifact/sha256.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass file:transfer.pass -in textures.tar -out artifact/textures.tar.enc
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-local-export-textures
          path: artifact/
          compression-level: 0
          retention-days: 1
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get Rust and Blender
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 4 --retry-all-errors https://r2.houseofkublai.com/rust/rust-1.100.0-x86_64-unknown-linux-gnu.tar -o rust.tar
          echo '15970bececb805c04914354f8a83adb6  rust.tar' | md5sum -c -
          curl -fsSL --retry 4 --retry-all-errors https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          sha256sum blender.tar.xz > blender.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-local-export-tools
          path: ${{ runner.temp }}/tools/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
