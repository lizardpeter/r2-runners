name: Public graphics and networking crate handoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rust-tour-dependency-handoff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch public Rust dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tour-deps/src"
          cd "$RUNNER_TEMP/tour-deps"
          cat > Cargo.toml <<'TOML'
          [package]
          name = "offline-public-graphics-dependencies"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.100"
          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          bytemuck = { version = "1", features = ["derive"] }
          glam = "0.30"
          font8x8 = "0.3"
          winit = "0.30.13"
          argon2 = "0.5"
          base64 = "0.22"
          uuid = { version = "1", features = ["serde", "v4", "js"] }
          ed25519-dalek = "2"
          zeroize = "1"
          naga = { version = "30.0", features = ["wgsl-in"] }
          [target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
          wgpu = { version = "=30.0.2", default-features = false, features = ["std", "wgsl", "vulkan"] }
          [target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
          wgpu = { version = "=30.0.2", default-features = false, features = ["std", "wgsl", "metal"] }
          [target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
          wgpu = { version = "=30.0.2", default-features = false, features = ["std", "wgsl", "webgpu"] }
          [target.'cfg(not(target_arch = "wasm32"))'.dependencies]
          ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
          pollster = "0.4"
          [target.'cfg(target_arch = "wasm32")'.dependencies]
          wasm-bindgen = "0.2"
          wasm-bindgen-futures = "0.4"
          js-sys = "0.3"
          web-time = "1"
          web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }
          TOML
          printf 'fn main() {}\n' > src/main.rs
          cargo generate-lockfile
          cargo vendor --locked --versioned-dirs vendor > vendor-config.toml
          tar -czf "$RUNNER_TEMP/tour-public-deps.tar.gz" Cargo.lock vendor vendor-config.toml
          sha256sum "$RUNNER_TEMP/tour-public-deps.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: public-graphics-rust-dependencies
          path: ${{ runner.temp }}/tour-public-deps.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
