name: IW5 public image validation tool handoff
on:
  push:
    paths:
      - '.github/workflows/iw5-public-image-oracle-handoff.yml'
  workflow_dispatch:
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fL --retry 3 'https://github.com/Laupetin/OpenAssetTools/releases/download/v0.34.1/oat-linux.tar.gz' -o oat-linux.tar.gz
          sha256sum oat-linux.tar.gz > sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-public-image-oracle
          path: |
            oat-linux.tar.gz
            sha256.txt
          retention-days: 1
