name: Ghosts authentic PAK mip decode

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ghosts-first-streamed-texture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-mip:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Decode exact original IW6 streamed-image PAK range
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tempfile,zlib
          # Original Point of Contact mp_alien_town.ff streamed GfxImage
          # row 0 (source-owned fileIndex=1; offset/end authenticated).
          start,end=88778934,88788527
          with tempfile.TemporaryDirectory() as work:
              headers=os.path.join(work,"headers")
              output=os.path.join(work,"source-span")
              subprocess.run(["curl","--fail","--silent","--show-error",
                  "--location","--retry","3","--connect-timeout","20",
                  "--max-time","120","--range",f"{start}-{end-1}",
                  "-H","Accept-Encoding: identity",
                  "-D",headers,"-o",output,
                  "https://r2.houseofkublai.com/ghosts/DUMP/imagefile1.pak"],
                  check=True)
              with open(headers,"rb") as h:
                  raw_headers=h.read().lower()
              if b" 206 " not in raw_headers:
                  raise RuntimeError("R2 did not return HTTP 206 Partial Content")
              if f"bytes {start}-{end-1}/".encode() not in raw_headers:
                  raise RuntimeError("R2 did not return exact original Content-Range")
              with open(output,"rb") as h:
                  packed=h.read()
          if len(packed)!=end-start:
              raise RuntimeError("original PAK range byte count mismatch")
          dec=zlib.decompressobj()
          image=dec.decompress(packed,16385)
          if not dec.eof or len(image)!=16384:
              raise RuntimeError(f"authored first mip size mismatch, decoded {len(image)}")
          print(json.dumps({
              "original_archive":"imagefile1.pak",
              "authenticated_source_span":[start,end],
              "compressed_bytes":len(packed),
              "source_format":"IW6 GfxImage stream / DXGI_FORMAT_BC3_UNORM",
              "authored_resolution":[128,128],
              "decoded_bytes":len(image),
              "decoded_sha256":hashlib.sha256(image).hexdigest(),
              "status":"original_bc3_mip_exact_span_verified",
          }))
          PY
