          path: ${{ runner.temp }}/bo1-full-game/transfer/transfer-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve supplemental source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-full-game-source-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/bo1-full-game/report/
