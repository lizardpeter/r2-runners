name: BO1 complete-game selective R2 ZIP64 probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bo1-full-game.yml"
      - "scripts/bo1_full_game_range.py"
      - "scripts/r2_download.py"
      - "scripts/test_bo1_full_game_range.py"
      - "scripts/shard_original_assets.py"
      - "scripts/bo1_probe.py"
  workflow_dispatch:
    inputs:
      preset:
        description: "Map(s) to inspect inside the full BO1 game archive"
        type: choice
        required: true
        default: both
        options: [nuketown, firingrange, both, all_multiplayer]
      iwd_start:
        description: "First complete original client IWD to retrieve (0-56)"
        required: true
        type: number
        default: 0
      iwd_count:
        description: "How many original complete IWDs to retrieve (0 means all if disk permits)"
        required: true
        type: number
        default: 4

permissions:
  contents: read

jobs:
  full-game-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate seekable original ZIP64 range-reader boundaries
        run: python3 -m unittest discover -s scripts -p "test_bo1_full_game_range.py" -v
      - name: Read original BO1 ZIP64 central directory over verified R2 byte ranges
        env:
          BO1_PRESET: ${{ inputs.preset || 'both' }}
          BO1_IWD_START: ${{ inputs.iwd_start || 0 }}
          BO1_IWD_COUNT: ${{ inputs.iwd_count || 4 }}
        run: |
          python3 scripts/bo1_full_game_range.py \
            --full-download \
            --preset "$BO1_PRESET" \
            --iwd-start "$BO1_IWD_START" \
            --iwd-count "$BO1_IWD_COUNT" \
            --output-dir "$RUNNER_TEMP/bo1-full-game"
      - name: Prepare byte-exact sub-512MiB original source transfer shards
        if: success()
        run: |
          python3 scripts/shard_original_assets.py \
            --source "$RUNNER_TEMP/bo1-full-game/original-bo1" \
            --target "$RUNNER_TEMP/bo1-full-game/transfer"
      - name: Preserve complete original client files — shard 00
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-original-client-${{ github.run_id }}-part-00
          path: ${{ runner.temp }}/bo1-full-game/transfer/part-00/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve complete original client files — shard 01
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-original-client-${{ github.run_id }}-part-01
          path: ${{ runner.temp }}/bo1-full-game/transfer/part-01/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve complete original client files — shard 02
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-original-client-${{ github.run_id }}-part-02
          path: ${{ runner.temp }}/bo1-full-game/transfer/part-02/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve complete original client files — shard 03
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-original-client-${{ github.run_id }}-part-03
          path: ${{ runner.temp }}/bo1-full-game/transfer/part-03/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve complete original client files — shard 04
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-original-client-${{ github.run_id }}-part-04
          path: ${{ runner.temp }}/bo1-full-game/transfer/part-04/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve complete original client files — shard 05
        if: success()
