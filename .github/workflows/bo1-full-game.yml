name: BO1 complete-game selective R2 ZIP64 probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bo1-full-game.yml"
      - "scripts/bo1_full_game_range.py"
      - "scripts/test_bo1_full_game_range.py"
      - "scripts/bo1_probe.py"
  workflow_dispatch:
    inputs:
      preset:
        description: "Map(s) to inspect inside the full BO1 game archive"
        type: choice
        required: true
        default: both
        options: [nuketown, firingrange, both, all_multiplayer]

permissions:
  contents: read

jobs:
  full-game-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate seekable original ZIP64 range-reader boundaries
        run: python3 -m unittest discover -s scripts -p "test_bo1_full_game_range.py" -v
      - name: Read original BO1 ZIP64 central directory over verified R2 byte ranges
        env:
          BO1_PRESET: ${{ inputs.preset || 'both' }}
        run: |
          python3 scripts/bo1_full_game_range.py \
            --preset "$BO1_PRESET" \
            --output-dir "$RUNNER_TEMP/bo1-full-game"
      - name: Preserve original extracted client FastFiles and IWD archives
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-original-client-files-${{ github.run_id }}
          path: ${{ runner.temp }}/bo1-full-game/original-bo1/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve supplemental source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-full-game-source-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/bo1-full-game/report/
          if-no-files-found: warn
          retention-days: 90
