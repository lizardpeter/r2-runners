name: T6 all original SABS SABL sound bank header index audit
on:
  push:
    branches: [feature/source-coverage-observatory-v1]
    paths:
      - .github/workflows/t6-observatory-sound-bank-index.yml
      - scripts/t6_observatory_sound_bank_index.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Audit original 2UX# sound bank header and entry directory ranges
        run: |
          set -euo pipefail
          python3 scripts/t6_observatory_sound_bank_index.py \
            --headers observatory/reports/t6/all-source-headers.json \
            --reader scripts/t6_observatory_ipak_index.py \
            --out observatory/reports/t6/sound-bank-index.json --workers 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t6-116-original-sound-bank-header-index-audit
          path: observatory/reports/t6/sound-bank-index.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish original-source sound bank directory metadata
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observatory/reports/t6/sound-bank-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proof(t6): validate 116 original SABS/SABL entry tables"
          for attempt in 1 2 3; do
            git fetch origin feature/source-coverage-observatory-v1
            git rebase origin/feature/source-coverage-observatory-v1
            if git push origin HEAD:feature/source-coverage-observatory-v1; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
