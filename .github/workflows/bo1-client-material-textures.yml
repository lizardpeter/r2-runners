name: BO1 original client complete texture dependency recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bo1-client-material-textures.yml"
      - "scripts/bo1_retail_texture_dependencies.py"
      - "scripts/shard_original_assets.py"
      - "scripts/r2_download.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-authentic-client-material-textures:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Download whole ORIGINAL BO1 client ZIP from user-owned Cloudflare R2
        env:
          BO1_CLIENT_URL: https://r2.houseofkublai.com/downloads/games/pluto_t5_full_game.zip
        run: |
          mkdir -p "$RUNNER_TEMP/bo1-client"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from r2_download import download
          target=Path(os.environ['RUNNER_TEMP'])/'bo1-client'/'pluto_t5_full_game.zip'
          length,sha256,_=download(os.environ['BO1_CLIENT_URL'],target)
          expected='09722cfb94a30e24a90a3544df53e78c93894304bb75511067dcf3cdaf11ee9b'
          if length!=11161080622 or sha256!=expected:
              raise ValueError(f'Original BO1 client ZIP authentication failed: {length}, {sha256}')
          print('Authenticated original complete 11.16GB PC retail client archive')
          PY
      - name: Recover original GfxWorld named texture dependencies from every client IWD
        run: |
          python3 scripts/bo1_retail_texture_dependencies.py \
            --client-zip "$RUNNER_TEMP/bo1-client/pluto_t5_full_game.zip" \
            --output-dir "$RUNNER_TEMP/bo1-client/recovered"
      - name: Shard exact original FastFiles and full original IWI image files for transfer
        run: |
          python3 scripts/shard_original_assets.py \
            --source "$RUNNER_TEMP/bo1-client/recovered/original-bo1" \
            --target "$RUNNER_TEMP/bo1-client/recovered/transfer"
      - name: Preserve ACTUAL complete original map/texture source files part 00
        uses: actions/upload-artifact@v4
        with:
          name: bo1-genuine-map-textures-${{ github.run_id }}-part-00
          path: ${{ runner.temp }}/bo1-client/recovered/transfer/part-00/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Preserve ACTUAL complete original map/texture source files part 01
        uses: actions/upload-artifact@v4
        with:
          name: bo1-genuine-map-textures-${{ github.run_id }}-part-01
