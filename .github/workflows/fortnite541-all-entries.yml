name: Fortnite 5.41 original full-entry SHA1 verification

on:
  pull_request:
    paths:
      - "scripts/fortnite541_full_entry_integrity.py"
      - ".github/workflows/fortnite541-all-entries.yml"
  push:
    branches: [main]
    paths:
      - "scripts/fortnite541_full_entry_integrity.py"
      - ".github/workflows/fortnite541-all-entries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-pak-entry-sha1:
    name: Full source SHA1 of ${{ matrix.archive }}
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        archive:
          - pakchunk0-WindowsClient.pak
          - pakchunk0_s1-WindowsClient.pak
          - pakchunk0_s2-WindowsClient.pak
          - pakchunk0_s3-WindowsClient.pak
          - pakchunk0_s4-WindowsClient.pak
          - pakchunk0_s5-WindowsClient.pak
          - pakchunk1-WindowsClient.pak
          - pakchunk1_s1-WindowsClient.pak
    steps:
      - name: Checkout public 5.41 authenticated source decoder
        uses: actions/checkout@v4
        with:
          repository: lizardpeter/Fortnite-reverse
          ref: 0742a8de70e692d9a994d50480fbce27905f0156
          path: source-decoder
          persist-credentials: false
      - name: Checkout R2 original-source evidence tools
        uses: actions/checkout@v4
        with:
          path: workbench
          persist-credentials: false
      - name: Verify safe source header/span invariants locally
        run: PYTHONPATH=workbench/scripts python3 workbench/scripts/fortnite541_full_entry_integrity.py --self-test
      - name: Stream full original retail PAK and SHA1-check every plain entry
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fortnite541-entry-proofs"
          PYTHONPATH=workbench/scripts python3 workbench/scripts/fortnite541_full_entry_integrity.py \
            --archive "$ARCHIVE" --destination "$RUNNER_TEMP/fortnite541-entry-proofs" \
            2>&1 | tee "$RUNNER_TEMP/fortnite541-entry-proofs/run.log"
      - name: Publish proof records only, no copyrighted game assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortnite541-entry-sha1-${{ matrix.archive }}-${{ github.run_id }}
          path: ${{ runner.temp }}/fortnite541-entry-proofs/
          compression-level: 6
          retention-days: 90
          if-no-files-found: warn
