name: Ghosts original FastFile local handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ghosts-original-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download original Ghosts path zone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghosts-original"
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 20 --max-time 300 \
            -o "$RUNNER_TEMP/ghosts-original/mp_alien_town_path.ff" \
            "https://r2.houseofkublai.com/ghosts/DUMP/mp_alien_town_path.ff"
          test "$(stat -c%s "$RUNNER_TEMP/ghosts-original/mp_alien_town_path.ff")" = 385068
          echo "e1d4e3294fd1e6f36552ce0fbfd0f1e5268c983d8c34ef58fcef6b9f0cf49dbb  $RUNNER_TEMP/ghosts-original/mp_alien_town_path.ff" | sha256sum --check
          echo "Original R2 source checksum verified"
      - name: Make source available for local reverse engineering
        uses: actions/upload-artifact@v4
        with:
          name: ghosts-path-original-short-retention
          path: ${{ runner.temp }}/ghosts-original/mp_alien_town_path.ff
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
