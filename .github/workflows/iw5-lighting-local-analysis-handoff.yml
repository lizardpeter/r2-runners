name: IW5 encrypted local analysis input handoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/iw5-lighting-local-analysis-handoff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Transfer verified original executable and map fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir transfer
          printf '%s' '' | base64 -d > pub.der
          openssl pkey -pubin -inform DER -in pub.der -out pub.pem
          openssl rand -hex 32 > pass
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in pass -out transfer/pass.rsa
          for p in iw5mp_ship.exe zone/english/mp_dome.ff zone/english/mp_alpha.ff zone/english/mp_hardhat.ff; do
            f="${p##*/}"
            curl -fsSL --retry 3 --retry-all-errors --max-time 240 "https://r2.houseofkublai.com/mw3/DUMP/$p" -o "$f"
            if [[ "$f" == iw5mp_ship.exe ]]; then
              echo '62ed2611dc422b9c0667d5ed390a79ee3d0e79fb88ee6a7ffa6bf638aa352a95  iw5mp_ship.exe' | sha256sum -c -
            fi
            sha256sum "$f" >> transfer/sha256.txt
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass file:pass -in "$f" -out "transfer/$f.enc"
            rm "$f"
          done
          rm pass
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-local-analysis-inputs-encrypted
          path: ${{ runner.temp }}/transfer/
          compression-level: 0
          retention-days: 1
