name: T6 original 366 WAD header and nested directory evidence
on:
  push:
    branches: [feature/source-coverage-observatory-v1]
    paths:
      - .github/workflows/t6-observatory-wad-index.yml
      - scripts/t6_observatory_wad_index.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Decode original T3w WAD section and 44-byte entry tables
        run: |
          set -euo pipefail
          python3 scripts/t6_observatory_wad_index.py \
            --headers observatory/reports/t6/all-source-headers.json \
            --reader scripts/t6_observatory_ipak_index.py \
            --out observatory/reports/t6/wad-index.json \
            --workers 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t6-366-original-r2-wad-directories
          path: observatory/reports/t6/wad-index.json
          retention-days: 90
          if-no-files-found: warn
      - name: Publish original-source WAD index summary
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observatory/reports/t6/wad-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proof(t6): structural original T3w directory census across 366 WAD files"
          for attempt in 1 2 3; do
            git fetch origin feature/source-coverage-observatory-v1
            git rebase origin/feature/source-coverage-observatory-v1
            if git push origin HEAD:feature/source-coverage-observatory-v1; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
