name: BO2 Store exact executable encrypted handoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bo2-store-exe-handoff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Fetch exact Store files and encrypt for local research handoff
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key = serialization.load_pem_public_key(b"""-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0dimOrBYiuVJYL5/5Ut2
          UGBcWFXntqgRGZKlnRIIZXxNX0LYZow4Tj1/M+CgcqpiDLty9oxURcQW1PeqQpG8
          w2TOAxmZiZQOCTR4b/q0Pi1btpWabOPtloDSCD9qnDxGfvJ4zez87XYU4Z/gvDWL
          hxN05a+I70v25mlkVlE24ioKmodLu8VHYVBW47lGoQL0klpqf5IIhNWQdJqz5NaT
          LDjrOwgezUq1WOOFN91kAasNReWnyqmXF01HmsyeFnwKHFFP4WRGaU4lkAY35g8S
          YbzqqUfy11gfrb4vG7+L+66P31mN53RZABsDsgad3pc/bngxwpo9n47h1gFqCNDC
          jQIDAQAB
          -----END PUBLIC KEY-----""")
          pins = {
              "t6mp.exe": "cf80b8058bce7e00e4c61ff3d673308c1fcd8061f18fe66710803538eab4bc01",
              "t6zm.exe": "7152ebe1c892ea8b1ea7a73811cb82bcdc22088816f5c731a6637d5461bb7416",
              "t6sp.exe": "0404f79cb36394b14cfc3321b7aa126a08518531564fa042fc14b82debe45c89",
          }
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "bo2-handoff"
          out.mkdir()
          aes = AESGCM.generate_key(bit_length=256)
          (out / "key.enc").write_bytes(key.encrypt(aes, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None)))
          for name, expected in pins.items():
              req=urllib.request.Request("https://r2.houseofkublai.com/bo2/DUMP/"+name, headers={"User-Agent":"bo2-store-research/1"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  data=response.read(64*1024*1024+1)
              assert len(data)<=64*1024*1024
              actual=hashlib.sha256(data).hexdigest()
              assert actual==expected,(name,actual,expected)
              nonce=os.urandom(12)
              (out / (name+".enc")).write_bytes(nonce+AESGCM(aes).encrypt(nonce,data,name.encode()))
              print(name,len(data),actual)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bo2-store-encrypted-executables
          path: ${{ runner.temp }}/bo2-handoff/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
