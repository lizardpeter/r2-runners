name: IW5 split local Rust and Blender tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/iw5-local-export-split-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get Rust and Blender
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 4 --retry-all-errors https://r2.houseofkublai.com/rust/rust-1.100.0-x86_64-unknown-linux-gnu.tar -o rust.tar
          echo '15970bececb805c04914354f8a83adb6  rust.tar' | md5sum -c -
          curl -fsSL --retry 4 --retry-all-errors https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          sha256sum blender.tar.xz > blender.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-local-rust-toolchain
          path: ${{ runner.temp }}/tools/rust.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-local-blender-tool
          path: |
            ${{ runner.temp }}/tools/blender.tar.xz
            ${{ runner.temp }}/tools/blender.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
