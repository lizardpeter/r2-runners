name: MW3 IW5 original R2 source probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/iw5-original-source.yml"
      - "scripts/iw5_retail_range.py"
      - "scripts/bo1_full_game_range.py"
      - "scripts/iw5_r2_access_diag.py"
  workflow_dispatch:
    inputs:
      preset:
        description: "Original IW5 files to inspect"
        required: true
        type: choice
        default: focused
        options: [inventory, focused, maps]

permissions:
  contents: read

jobs:
  inspect-original-iw5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compare bounded public R2 access patterns
        run: python3 scripts/iw5_r2_access_diag.py
      - name: Inspect original MW3 zip over R2 HTTP ranges
        env:
          IW5_PRESET: ${{ inputs.preset || 'focused' }}
        run: |
          python3 scripts/iw5_retail_range.py \
            --preset "$IW5_PRESET" \
            --output-dir "$RUNNER_TEMP/iw5-report"
      - name: Save provenance report only, never original game bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iw5-original-source-provenance
          path: ${{ runner.temp }}/iw5-report/*.json
          retention-days: 7
          if-no-files-found: warn
