name: Ghidra 12.2 tool handoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ghidra-122-tool-handoff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve public Ghidra distribution
        run: |
          mkdir -p handoff
          curl --fail --location --retry 3 -o handoff/ghidra_12.2_PUBLIC_20261016.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  handoff/ghidra_12.2_PUBLIC_20261016.zip" | sha256sum -c
          split -b 300M handoff/ghidra_12.2_PUBLIC_20261016.zip handoff/ghidra-part-
          rm handoff/ghidra_12.2_PUBLIC_20261016.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.2-part-a
          path: handoff/ghidra-part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.2-part-b
          path: handoff/ghidra-part-ab
          compression-level: 0
          retention-days: 1
