name: Ghosts original source imagefile1 PAK handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ghosts-first-pak-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-imagefile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download entire untouched original IW6 imagefile1.pak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghosts-original"
          curl --fail --silent --show-error --location --retry 4             --retry-all-errors --retry-delay 3 --connect-timeout 25             --max-time 900             -o "$RUNNER_TEMP/ghosts-original/imagefile1.pak"             "https://r2.houseofkublai.com/ghosts/DUMP/imagefile1.pak"
          test "$(stat -c%s "$RUNNER_TEMP/ghosts-original/imagefile1.pak")" = 144574882
          sha256sum "$RUNNER_TEMP/ghosts-original/imagefile1.pak"
      - name: Make real original texture archive available for local decoder testing
        uses: actions/upload-artifact@v4
        with:
          name: ghosts-original-imagefile1-pak
          path: ${{ runner.temp }}/ghosts-original/imagefile1.pak
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
