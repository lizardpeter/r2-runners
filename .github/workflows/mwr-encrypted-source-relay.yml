          openssl cms -encrypt -binary -stream -aes-256-gcm -outform DER \
            -in "$RUNNER_TEMP/mp_crash_snow.ff" \
            -out "$RUNNER_TEMP/mp_crash_snow.ff.cms" "$RUNNER_TEMP/mwr-transfer-public.crt"
          test -s "$RUNNER_TEMP/mp_crash_snow.ff.cms"
          rm "$RUNNER_TEMP/mp_crash_snow.ff"
          echo 'Only AES-256-GCM/RSA-3072 ciphertext is published; private decryption key lives only in the assistant local container.'
      - name: Transfer encrypted-only H1 source blob
        uses: actions/upload-artifact@v4
        with:
          name: h1-original-mp-crash-snow-encrypted-only
          path: ${{ runner.temp }}/mp_crash_snow.ff.cms
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
