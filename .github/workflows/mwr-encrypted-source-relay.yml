name: H1 encrypted temporary original source relay to private offline build
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mwr-encrypted-source-relay.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt-real-h1-fastfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify the exact original H1 map into ephemeral runner scratch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 25 --max-time 1200 \
            --output "$RUNNER_TEMP/mp_crash_snow.ff" \
            "https://r2.houseofkublai.com/h1/h1_full_files/zone/mp_crash_snow.ff"
          test "$(stat -c%s "$RUNNER_TEMP/mp_crash_snow.ff")" = 343800140
          echo '8c88dd68e52610f6256cf8bad6743b09d346ef1d81e39852ff388b1ab82590a0  '${RUNNER_TEMP}'/mp_crash_snow.ff' | sha256sum -c -
      - name: Encrypt retail FastFile using public-only ephemeral RSA certificate
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mwr-transfer-public.crt" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEMTCCApmgAwIBAgIUOuNJie3BJWzHPTt9LjjBJBxwmFkwDQYJKoZIhvcNAQEL
          BQAwKDEmMCQGA1UEAwwdRXBoZW1lcmFsIE1XUiBTb3VyY2UgVHJhbnNmZXIwHhcN
