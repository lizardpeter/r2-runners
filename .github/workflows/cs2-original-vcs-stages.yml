name: CS2 original Source 2 Vulkan VCS handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cs2-original-vcs-stages.yml"
      - "scripts/cs2_original_vcs_handoff.py"
      - "scripts/cs2_material_source_handoff.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-shader-stages:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check strict authenticated VPK shader selectors
        shell: pwsh
        run: |
          python scripts/cs2_material_source_handoff.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source VPK selector self-test failed' }
          python scripts/cs2_original_vcs_handoff.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'Original VCS selector self-test failed' }

      - name: Install public SteamRE downloader
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cs2-authentic-vcs'
          $tool = Join-Path $root 'SteamRE'
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          $zip = Join-Path $root 'DepotDownloader.zip'
          Invoke-WebRequest -Uri 'https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-windows-x64.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $tool -Force
          $exe = Join-Path $tool 'DepotDownloader.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'SteamRE downloader missing' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CS2_VCS_SOURCE_ROOT=$root"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CS2_VCS_DOWNLOADER=$exe"

      - name: Fetch exact Valve Vulkan source shader VPK index
        shell: pwsh
        run: |
          $root = $env:CS2_VCS_SOURCE_ROOT
          $filelist = Join-Path $root 'shader-dir-index-filelist.txt'
          'game/csgo/shaders_vulkan_dir.vpk' | Set-Content -LiteralPath $filelist -Encoding ascii
          & $env:CS2_VCS_DOWNLOADER -app 730 -depot 2347770 -filelist $filelist -dir $root -max-downloads 4
          if ($LASTEXITCODE -ne 0) { throw 'Original shader VPK index acquisition failed' }
          $index = Join-Path $root 'game/csgo/shaders_vulkan_dir.vpk'
          if (-not (Test-Path -LiteralPath $index)) { throw 'Original Valve shader index unavailable' }

      - name: Determine indexed VCS stages and exact physical segments
        shell: pwsh
        run: |
          $root = $env:CS2_VCS_SOURCE_ROOT
          $index = Join-Path $root 'game/csgo/shaders_vulkan_dir.vpk'
          python scripts/cs2_original_vcs_handoff.py plan --index $index --output $root
          if ($LASTEXITCODE -ne 0) { throw 'Could not plan original VCS stage download' }

      - name: Download physical VPK segments containing only indexed requested shaders
        shell: pwsh
        run: |
          $root = $env:CS2_VCS_SOURCE_ROOT
          $filelist = Join-Path $root 'shaders-segment-filelist.txt'
          $segments = @(Get-Content -LiteralPath $filelist | Where-Object { $_.Trim() })
          if ($segments.Count -gt 0) {
            Write-Host "Authentic VCS source physical segments: $($segments -join ', ')"
            & $env:CS2_VCS_DOWNLOADER -app 730 -depot 2347770 -filelist $filelist -dir $root -max-downloads 4
            if ($LASTEXITCODE -ne 0) { throw 'Original numbered shader VPK acquisition failed' }
          }

      - name: CRC-verify and extract source compiled VCS files
        shell: pwsh
        run: |
          $root = $env:CS2_VCS_SOURCE_ROOT
          $index = Join-Path $root 'game/csgo/shaders_vulkan_dir.vpk'
          $output = Join-Path $root 'original-vcs'
          python scripts/cs2_original_vcs_handoff.py extract --index $index --depot-root $root --output $output
          if ($LASTEXITCODE -ne 0) { throw 'VCS original-source CRC verification failed' }

      - name: Upload original compiled VCS files, not only a metadata report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-original-vulkan-vcs-material-families
          path: ${{ runner.temp }}/cs2-authentic-vcs/original-vcs/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

      - name: Preserve exact shader source plan even if acquisition fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-original-vcs-acquisition-diagnostics
          path: |
            ${{ runner.temp }}/cs2-authentic-vcs/source_shader_plan.json
            ${{ runner.temp }}/cs2-authentic-vcs/shaders-segment-filelist.txt
            ${{ runner.temp }}/cs2-authentic-vcs/shader-dir-index-filelist.txt
          if-no-files-found: warn
          retention-days: 7
