name: Ghosts IW6 original main source local research handoff

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ghosts-original-main-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve authentic IW6 Point of Contact world FastFile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghosts"
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 20 --max-time 620 \
            -o "$RUNNER_TEMP/ghosts/mp_alien_town.ff" \
            https://r2.houseofkublai.com/ghosts/DUMP/mp_alien_town.ff
          test "$(stat -c%s "$RUNNER_TEMP/ghosts/mp_alien_town.ff")" -eq 186301740
          echo "e5fa1a4b094466e329f5f4f7d035c9afd31d1b1822121ec8086c05174a796d81  $RUNNER_TEMP/ghosts/mp_alien_town.ff" | sha256sum --check
          echo "Original world file SHA-256 verified; 186301740 bytes"
      - name: Short-lived exact source for private importer research
        uses: actions/upload-artifact@v4
        with:
          name: ghosts-iw6-authenticated-main-source
          path: ${{ runner.temp }}/ghosts/mp_alien_town.ff
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
