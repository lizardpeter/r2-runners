name: x360-native 1.34.6 source reference handoff

on:
  workflow_dispatch:
  push:
    branches:
      - metro-v2-17559-handoff-20261124
    paths:
      - "x360-native-trigger.txt"

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download tagged x360-native source, exact ReXGlue submodule, and Linux x64 reference build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/x360-native-reference
          cd handoff/x360-native-reference
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 1200 \
            --output x360-native-v1.34.6-source.zip \
            https://github.com/fabegalo/x360-native/archive/refs/tags/v1.34.6.zip
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 1200 \
            --output rexglue-sdk-f5337cdc.zip \
            https://github.com/rexglue/rexglue-sdk/archive/f5337cdc947ff6d4c4196737e2c807a48f2a1fc2.zip
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 1200 \
            --output x360-native-1.34.6-linux-x64.tar.gz \
            https://github.com/fabegalo/x360-native/releases/download/v1.34.6/x360-native-1.34.6-linux-x64.tar.gz
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path(".")
          expected={"x360-native-1.34.6-linux-x64.tar.gz":69370937}
          rows=[]
          for p in sorted(x for x in root.iterdir() if x.is_file()):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(4*1024*1024),b""): h.update(c)
              size=p.stat().st_size
              rows.append({"file":p.name,"bytes":size,"sha256":h.hexdigest().upper(),
                           "expected_bytes":expected.get(p.name),
                           "size_ok":p.name not in expected or size==expected[p.name]})
          (root/"verification.json").write_text(json.dumps({
              "project":"fabegalo/x360-native",
              "tag":"v1.34.6",
              "rexglue_sdk_commit":"f5337cdc947ff6d4c4196737e2c807a48f2a1fc2",
              "files":rows
          },indent=2)+"\n")
          print(json.dumps(rows,indent=2))
          if any(not r["size_ok"] for r in rows): raise SystemExit("size verification failed")
          PY
          cat > README.txt <<'EOF'
          x360-native v1.34.6 reference package
          ====================================
          This is an external BSD-3-Clause research project, downloaded as a reference.
          The source ZIP does not contain Git submodules; rexglue-sdk is included at the
          exact commit recorded by x360-native tag v1.34.6.
          The Linux x64 release archive is supplied for runtime/CLI inspection.
          Original Microsoft dashboard binaries are not included in this reference package.
          See verification.json for exact sizes and SHA-256 hashes.
          EOF

      - name: Retrieve public Xbox 360 font candidates for hash comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/x360-native-reference/font-candidates
          cd handoff/x360-native-reference/font-candidates
          for file in xenonclatin.xtt xenonclatin.xttp1 xenonjklatin.xtt xenonjklatin.xttp1; do
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 \\
              --output "$file" "https://raw.githubusercontent.com/dps-910/Original-Fonts-Xbox-360/main/$file"
          done
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected={
              "xenonjklatin.xtt":"9F20409BBE22CA92D483C24AA0930AC8EC761712C16D00C477F145071E707425",
              "xenonclatin.xtt":"977BBE13D5545D300E57DACF9DFF492476452F50880EF3868D3AA308D041187D",
          }
          rows=[]
          for p in sorted(Path(".").iterdir()):
              if not p.is_file(): continue
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(4*1024*1024),b""): h.update(c)
              digest=h.hexdigest().upper()
              rows.append({"file":p.name,"bytes":p.stat().st_size,"sha256":digest,
                           "expected_17559_sha256":expected.get(p.name),
                           "matches_17559":expected.get(p.name)==digest if p.name in expected else None})
          Path("font-candidates.json").write_text(json.dumps(rows,indent=2)+"\\n")
          print(json.dumps(rows,indent=2))
          PY

      - name: Retrieve original Xbox 360 font candidates for 17559 hash comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/x360-native-reference/font-candidates
          cd handoff/x360-native-reference/font-candidates
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 --output xenonclatin.xtt https://raw.githubusercontent.com/dps-910/Original-Fonts-Xbox-360/main/xenonclatin.xtt
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 --output xenonclatin.xttp1 https://raw.githubusercontent.com/dps-910/Original-Fonts-Xbox-360/main/xenonclatin.xttp1
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 --output xenonjklatin.xtt https://raw.githubusercontent.com/dps-910/Original-Fonts-Xbox-360/main/xenonjklatin.xtt
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 --output xenonjklatin.xttp1 https://raw.githubusercontent.com/dps-910/Original-Fonts-Xbox-360/main/xenonjklatin.xttp1
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected={
              "xenonjklatin.xtt":"9F20409BBE22CA92D483C24AA0930AC8EC761712C16D00C477F145071E707425",
              "xenonclatin.xtt":"977BBE13D5545D300E57DACF9DFF492476452F50880EF3868D3AA308D041187D",
          }
          rows=[]
          for p in sorted(Path(".").iterdir()):
              if not p.is_file(): continue
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(4*1024*1024),b""): h.update(c)
              digest=h.hexdigest().upper()
              rows.append({"file":p.name,"bytes":p.stat().st_size,"sha256":digest,
                           "expected_17559_sha256":expected.get(p.name),
                           "matches_17559":expected.get(p.name)==digest if p.name in expected else None})
          Path("font-candidates.json").write_text(json.dumps(rows,indent=2)+"\\n")
          print(json.dumps(rows,indent=2))
          PY

      - name: Upload reference source and runtime package
        uses: actions/upload-artifact@v4
        with:
          name: x360-native-v1.34.6-source-reference
          path: handoff/x360-native-reference/
          if-no-files-found: error
          retention-days: 90
