name: IW5 encrypted local Dome handoff
on:
  push:
    branches: [main]
    paths: [".github/workflows/iw5-dome-local-handoff.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transfer encrypted source parts and source map for local-only compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iw5-handoff" "$RUNNER_TEMP/original"
          cd "$RUNNER_TEMP"
          cat > transfer.crt <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIELzCCApegAwIBAgIUZ4hgkFg3q/+/4DSPIMyjv5quXfswDQYJKoZIhvcNAQEL
          BQAwJzElMCMGA1UEAwwcdGVtcG9yYXJ5IElXNSBsb2NhbCB0cmFuc2ZlcjAeFw0y
          NjExMjYwNjAwNThaFw0yNjExMjgwNjAwNThaMCcxJTAjBgNVBAMMHHRlbXBvcmFy
          eSBJVzUgbG9jYWwgdHJhbnNmZXIwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGK
          AoIBgQDmcJ/JfLbIItE7f5HKhqsqmQqonHENHuh3+X8x83QV1CFU2/UR7Dol78O6
          nbTFxbmkTXLAOay9gwxUvhf4n0UTUVAKiGw9MjQxUNymv8bZo9+8vbgJ5wDu+oU4
          EgN5iC4jUSmvmVKV7MDoaQzayUgkla6fdaCM0DpWiO5jxTAy75W7XdZ5jhGWVQM9
          qr8sChEzzt0yoFP5bHnHlpXAwngkJknmcz0iBYp8gFGHTN5DuugmZqnukyexB3rL
          3hrFSl7Cv8dKAevmDliFBE6pNNm+nCjbrUPyH6aYm+f231ICS0Hq1hFZyi3T5f/l
          s01bupSb5Tz989M7pkfZFLKjj6VBv7tuvfclFA5YGDV47/limMbwuwUAKFxFzYe8
          nIibO+QTP0G176IdU13Wcn2r0URaYZhg0vnHHfWINeOVf7q0qgSGlYAinK0jSc4Y
          AoF+Q3MGQ2WTiWjv07PFd/DeO1yE65aB0As8qR4G5r7e/ZuiTmxt29HmO+oa2Wpd
          PFv6ZQsCAwEAAaNTMFEwHQYDVR0OBBYEFDuDOQJk064Sw8SlN8ikF6X2HyXMMB8G
          A1UdIwQYMBaAFDuDOQJk064Sw8SlN8ikF6X2HyXMMA8GA1UdEwEB/wQFMAMBAf8w
          DQYJKoZIhvcNAQELBQADggGBANdSZBkLJtfNJV4lyav+PtdJ7FSus3BwCG5KSKQr
          F/3JUk/XvVb6agiAhIDF4K+4skTCf+UgOJzqmq0gVG5j0LEG2nnt0AuutcwGOyMf
          ixfxnCrBNmu6OXI63svas0B5QS+V2BQsG8M4RXVNlosPmUisNGWVetB8GgcpQRz0
          f4LomTnGRqmUy1ol0nf4tjpxS3Tr/GEKCo0Fh9LCIYhn/UmfDxn9kEFTtSkb7Yxl
          wBmNsruVapJcVs0EPIyu9oiYO4xVqBROsqFzGLiYDMikLfOiOi7kQIhf3ushbG
          D78bSbdih17X+R0c9W/shiYwZOWV30lX6/6u/QU6eRUWySWPxto39i1GBLnA18W5
