          PEM
          for i in $(seq 0 11); do
            curl -fsSL --retry 4 --retry-all-errors --max-time 60 "https://r2.houseofkublai.com/iw5-handoff-538d7fc0a6d436f4/part-$i.bin" -o "iw5-handoff/part-$i.bin"
          done
          for f in mp_dome.ff common_mp.ff patch_mp.ff; do
            curl -fsSL --retry 4 --retry-all-errors --max-time 300 "https://r2.houseofkublai.com/mw3/DUMP/zone/english/$f" -o "original/$f"
            openssl cms -encrypt -binary -aes256 -outform DER -in "original/$f" -out "iw5-handoff/$f.cms" transfer.crt
          done
          test "$(stat -c%s original/mp_dome.ff)" = 60719125
          sha256sum original/*.ff > iw5-handoff/original-sha256.txt
          rm -rf original
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-encrypted-local-dome-handoff
          path: ${{ runner.temp }}/iw5-handoff/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
