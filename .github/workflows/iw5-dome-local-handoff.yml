name: IW5 encrypted local Dome handoff
on:
  push:
    branches: [main]
    paths: [".github/workflows/iw5-dome-local-handoff.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transfer encrypted source parts and source map for local-only compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iw5-handoff" "$RUNNER_TEMP/original"
          cd "$RUNNER_TEMP"
          printf '%s' '' | base64 -d > transfer.der
          openssl pkey -pubin -inform DER -in transfer.der -out transfer.pub
          openssl rand -hex 32 > transfer.pass
          openssl pkeyutl -encrypt -pubin -inkey transfer.pub -pkeyopt rsa_padding_mode:oaep -in transfer.pass -out iw5-handoff/transfer.pass.rsa
          for i in $(seq 0 11); do
            curl -fsSL --retry 4 --retry-all-errors --max-time 60 "https://r2.houseofkublai.com/iw5-handoff-538d7fc0a6d436f4/part-$i.bin" -o "iw5-handoff/part-$i.bin"
          done
          for f in mp_dome.ff common_mp.ff patch_mp.ff; do
            curl -fsSL --retry 4 --retry-all-errors --max-time 300 "https://r2.houseofkublai.com/mw3/DUMP/zone/english/$f" -o "original/$f"
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass file:transfer.pass -in "original/$f" -out "iw5-handoff/$f.enc"
          done
          test "$(stat -c%s original/mp_dome.ff)" = 60719125
          sha256sum original/*.ff > iw5-handoff/original-sha256.txt
          rm -rf original transfer.pass
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-encrypted-local-dome-handoff
          path: ${{ runner.temp }}/iw5-handoff/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
