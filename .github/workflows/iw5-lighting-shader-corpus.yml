name: IW5 lighting shader corpus handoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/iw5-lighting-shader-corpus.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir handoff
          printf '%s' '' | base64 -d > pub.der
          openssl pkey -pubin -inform DER -in pub.der -out pub.pem
          openssl rand -hex 32 > pass
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in pass -out handoff/pass.rsa
          for f in mp_dome.ff mp_alpha.ff mp_hardhat.ff common_mp.ff; do
            curl -fsSL --retry 3 "https://r2.houseofkublai.com/mw3/DUMP/zone/english/$f" -o "$f"
            sha256sum "$f" >> handoff/sha256.txt
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass file:pass -in "$f" -out "handoff/$f.enc"
            rm "$f"
          done
          rm pass
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-lighting-shader-corpus-encrypted
          path: ${{ runner.temp }}/handoff/
          compression-level: 0
          retention-days: 1
