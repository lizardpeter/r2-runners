name: IW5 encrypted lighting source delta handoff
on:
  push:
    paths: [".github/workflows/iw5-lighting-delta-handoff.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          for i in 0 1; do
            curl -fsSL --retry 3 "https://r2.houseofkublai.com/iw5-source-delta-c8e4a16b953d/delta-$i.bin" -o "$RUNNER_TEMP/handoff/delta-$i.bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: iw5-lighting-source-delta
          path: ${{ runner.temp }}/handoff/
          compression-level: 0
          retention-days: 1
