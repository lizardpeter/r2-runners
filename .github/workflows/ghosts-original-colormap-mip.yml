name: Ghosts original material PAK source-mip verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ghosts-original-colormap-mip.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retail-pak-mip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify original Point of Contact source-owned BC3 mip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,urllib.request,zlib
          # Original mp_alien_town.ff, XAsset #25 source:
          # 104-byte GfxImage at decoded offset 135328.
          # Authored XStreamFile row 0: imagefile1.pak [88778934,88788527).
          start,end=88778934,88788527
          url="https://r2.houseofkublai.com/ghosts/DUMP/imagefile1.pak"
          request=urllib.request.Request(url,headers={
              "Range":f"bytes={start}-{end-1}",
              "Accept-Encoding":"identity"})
          with urllib.request.urlopen(request,timeout=65) as response:
              assert response.status==206,(response.status,response.headers)
              assert response.headers.get("Content-Range","").startswith(
                  f"bytes {start}-{end-1}/"),response.headers
              compressed=response.read(20000)
          assert len(compressed)==end-start,(len(compressed),end-start)
          pixels=zlib.decompress(compressed)
          assert len(pixels)==128*128,(len(pixels),128*128)
          print("AUTHENTIC IW6 colorMap: patch_001 source GfxImage format 77 (BC3),")
          print("  stream 128x128, 1 authored mip, 16,384 decoded BC3 bytes;")
          print("  original imagefile1.pak range 88,778,934..88,788,527 (9,593 bytes), HTTP 206")
          print("  source compressed SHA-256:",hashlib.sha256(compressed).hexdigest())
          print("  source BC3 block bytes SHA-256:",hashlib.sha256(pixels).hexdigest())
          print("  no original texture payloads published")
          PY
